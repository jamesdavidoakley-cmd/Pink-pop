<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snack Pals</title>
<meta name="description" content="Pick 10 snacks for the table, line them up, then watch the hungry crew eat the lot. For ages 3 and up.">
<meta name="theme-color" content="#ff8c42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Snack Pals">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
/* Layout: one-screen toy app. Top: scene tabs. Middle: the 2.5D stage. Bottom: 8 action buttons + character tray. */
:root{
  --cream:#fff4dc; --wood:#b9743a; --wood-dk:#7a4520; --sun:#ffb347; --sun-dk:#e0760a;
  --berry:#ff5d8f; --sky:#8fd3ff; --grass:#6fcf6a; --grape:#8a5cf6; --ink:#3a2a1e; --ink-soft:#6b5342;
  --panel:#fff9ec; --panel-edge:#f2d9a6; --shadow:0 6px 0 rgba(90,50,20,.18), 0 10px 24px rgba(90,50,20,.18);
  --font:"Nunito","Varela Round","SF Pro Rounded",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--cream);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;background:var(--cream)}

/* ---- top bar ---- */
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));
  background:linear-gradient(#fff9ec,#f8e7c0);border-bottom:3px solid var(--panel-edge);position:relative;z-index:5}
#scenes{display:flex;gap:6px;flex:1 1 auto;min-width:0}
.tab{flex:1 1 0;min-width:0;height:54px;border:0;border-radius:16px;background:#fff;box-shadow:0 3px 0 #e3c88f;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2px 4px;cursor:pointer;transition:transform .12s}
.tab .ic{font-size:24px;line-height:1.1}
.tab .lb{font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab.on{background:linear-gradient(#ffd79a,#ffb347);box-shadow:0 3px 0 var(--sun-dk);transform:translateY(1px)}
.tab:active{transform:scale(.95)}
.ib{flex:0 0 auto;width:48px;height:54px;border:0;border-radius:16px;background:#fff;box-shadow:0 3px 0 #e3c88f;font-size:22px;cursor:pointer;display:grid;place-items:center;position:relative}
.ib:active{transform:scale(.93)}
.ib.off{opacity:.55}
#bin.hold::after{content:"";position:absolute;inset:-4px;border-radius:20px;border:3px solid var(--berry);animation:holdring 1.1s linear forwards}
@keyframes holdring{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* ---- stage ---- */
#stagewrap{flex:1 1 auto;position:relative;overflow:hidden;background:var(--sky);min-height:0;touch-action:none}
#stage{position:absolute;left:0;top:0;width:1000px;transform-origin:0 0;will-change:transform}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#layer,#fx{position:absolute;inset:0}
#fx{pointer-events:none;z-index:5000;overflow:visible}

/* characters */
.crew{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform;touch-action:none;cursor:grab}
.crew .anim{width:100%;height:100%;transform-origin:50% 100%}
.crew svg{width:100%;height:100%;overflow:visible;display:block}
.crew .shade{transform-origin:50% 100%}
.crew.lift{z-index:9000!important;cursor:grabbing}
.crew.lift .anim{transform:scale(1.12) translateY(-10px);filter:drop-shadow(0 18px 10px rgba(0,0,0,.28))}
.crew .anim{transition:filter .2s}
.crew.dim .anim{filter:brightness(.86)}
.crew .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite;animation-delay:var(--bd,0s)}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.crew .arm,.crew .headg,.crew .mouth,.crew .body-g,.crew .wings{transform-box:fill-box}
.crew .arm.l{transform-origin:90% 15%}.crew .arm.r{transform-origin:10% 15%}
.crew .headg{transform-origin:50% 95%}
.crew .mouth{transform-origin:50% 50%}
.crew .wings{transform-origin:50% 50%}
.crew .idle{animation:breathe 2.6s ease-in-out infinite;animation-delay:var(--bd,0s);transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
.crew .wings{animation:flap 1.1s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}

/* placed pop */
.crew.pop .anim{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2,.2)}60%{transform:scale(1.15,.9)}100%{transform:scale(1,1)}}
/* land squash */
.crew.land .anim{animation:land .4s ease-out}
@keyframes land{0%{transform:scale(1.25,.7)}50%{transform:scale(.9,1.12)}100%{transform:scale(1,1)}}
/* solo hop */
.crew.hop .anim{animation:hop .6s ease-in-out}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(4px) scale(1.1,.9)}50%{transform:translateY(-34px) scale(.95,1.08)}80%{transform:translateY(0) scale(1.05,.95)}}

/* ---- actions ---- */
.crew.act-dance .anim{animation:dance .5s ease-in-out infinite alternate;animation-delay:var(--ad,0s)}
@keyframes dance{0%{transform:translateY(0) rotate(-6deg) scale(1.02,.98)}100%{transform:translateY(-16px) rotate(6deg) scale(.98,1.04)}}
.crew.act-dance .arm.l{animation:armL .5s ease-in-out infinite alternate;animation-delay:var(--ad,0s)}
.crew.act-dance .arm.r{animation:armR .5s ease-in-out infinite alternate;animation-delay:var(--ad,0s)}
@keyframes armL{0%{transform:rotate(-30deg)}100%{transform:rotate(-130deg)}}
@keyframes armR{0%{transform:rotate(130deg)}100%{transform:rotate(30deg)}}
.crew.act-dance .headg{animation:headbob .5s ease-in-out infinite alternate;animation-delay:var(--ad,0s)}
@keyframes headbob{0%{transform:rotate(-8deg)}100%{transform:rotate(8deg)}}

.crew.act-spin .anim{animation:spin 1.1s cubic-bezier(.4,0,.3,1) infinite;animation-delay:var(--ad,0s)}
@keyframes spin{0%{transform:rotate(0) translateY(0)}30%{transform:rotate(120deg) translateY(-30px)}70%{transform:rotate(260deg) translateY(-30px)}100%{transform:rotate(360deg) translateY(0)}}

.crew.act-wave .arm.r{animation:wave .5s ease-in-out infinite alternate}
@keyframes wave{0%{transform:rotate(150deg)}100%{transform:rotate(200deg)}}
.crew.act-wave .headg{animation:headbob 1s ease-in-out infinite alternate}

.crew.act-sleep .anim{transform:rotate(14deg) translateX(6px);transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.crew.act-sleep .eyes{animation:none;transform:scaleY(.06)}
.crew.act-sleep .mouth{transform:scale(.6)}
.crew.act-sleep .anim{animation:snore 2.4s ease-in-out infinite;animation-delay:var(--ad,0s)}
@keyframes snore{0%,100%{transform:rotate(14deg) translateX(6px) scale(1,1)}50%{transform:rotate(14deg) translateX(6px) scale(1.03,1.04)}}

.crew.act-sing .anim{animation:sing .42s ease-in-out infinite alternate;animation-delay:var(--ad,0s)}
@keyframes sing{0%{transform:translateY(0) scale(1,1)}100%{transform:translateY(-10px) scale(.97,1.05)}}
.crew.act-sing .mouth{transform:scale(1.8,2.6)}
.crew.act-sing .arm.l{transform:rotate(-120deg)}.crew.act-sing .arm.r{transform:rotate(120deg)}

.crew.act-peek .arm.l{animation:peekL 2.2s ease-in-out infinite;animation-delay:var(--ad,0s)}
.crew.act-peek .arm.r{animation:peekR 2.2s ease-in-out infinite;animation-delay:var(--ad,0s)}
@keyframes peekL{0%,10%{transform:rotate(0)}25%,65%{transform:translate(-3px,-19px) rotate(-162deg)}80%,100%{transform:rotate(0)}}
@keyframes peekR{0%,10%{transform:rotate(0)}25%,65%{transform:translate(3px,-19px) rotate(162deg)}80%,100%{transform:rotate(0)}}
.crew.act-peek .anim{animation:peekhop 2.2s ease-in-out infinite;animation-delay:var(--ad,0s)}
@keyframes peekhop{0%,70%,100%{transform:translateY(0) scale(1,1)}78%{transform:translateY(-22px) scale(1.06,1.08)}88%{transform:translateY(0) scale(1.05,.95)}}

.crew.act-march .anim{animation:march .36s ease-in-out infinite alternate}
@keyframes march{0%{transform:translateY(0) rotate(-4deg)}100%{transform:translateY(-8px) rotate(4deg)}}
.crew.flying .anim{animation:flyspin .9s linear infinite}
@keyframes flyspin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

/* fx */
.fx{position:absolute;left:0;top:0;pointer-events:none;will-change:transform,opacity;font-weight:900}
.fx.spark{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px #ffe27a;animation:spark .7s ease-out forwards}
@keyframes spark{0%{transform:translate(var(--x),var(--y)) scale(.3);opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(1.1);opacity:0}}
.fx.note{font-size:40px;color:var(--grape);text-shadow:0 2px 0 #fff;animation:note 1.4s ease-out forwards}
@keyframes note{0%{transform:translate(var(--x),var(--y)) scale(.4) rotate(-10deg);opacity:0}20%{opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) - 120px)) scale(1.1) rotate(14deg);opacity:0}}
.fx.zz{font-size:34px;color:#5b6dd6;text-shadow:0 2px 0 #fff;animation:zz 1.8s ease-out forwards}
@keyframes zz{0%{transform:translate(var(--x),var(--y)) scale(.5);opacity:0}25%{opacity:1}100%{transform:translate(calc(var(--x) + 40px),calc(var(--y) - 90px)) scale(1.3);opacity:0}}
.fx.puff{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);animation:puff .55s ease-out forwards}
@keyframes puff{0%{transform:translate(var(--x),var(--y)) scale(.3);opacity:.9}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(1.6);opacity:0}}
.fx.heart{font-size:32px;color:var(--berry);animation:note 1.2s ease-out forwards}
.fx.word{font-size:46px;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 rgba(0,0,0,.2);animation:word 1.1s ease-out forwards;white-space:nowrap}
@keyframes word{0%{transform:translate(var(--x),var(--y)) scale(.3) rotate(-8deg);opacity:0}30%{transform:translate(var(--x),calc(var(--y) - 30px)) scale(1.15) rotate(4deg);opacity:1}100%{transform:translate(var(--x),calc(var(--y) - 90px)) scale(1);opacity:0}}

/* drop hint */
#drophint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s}
#drophint.on{opacity:1}
#drophint .zone{position:absolute;border-radius:14px;background:rgba(255,255,255,.22);border:4px dashed rgba(255,255,255,.75);box-shadow:inset 0 0 30px rgba(255,255,255,.3)}
#drophint .zone.near{background:rgba(255,230,120,.45);border-color:#fff}


/* ---- snack panel ---- */
#panel{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:86px;padding:8px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));
  background:linear-gradient(#fff9ec,#fbefd4);border-top:3px solid var(--panel-edge);position:relative;z-index:5}
#progress{display:flex;align-items:center;gap:8px;width:100%;max-width:640px}
#count{flex:0 0 auto;width:64px;height:64px;border-radius:20px;background:linear-gradient(#ff9a5c,#ff6a1f);color:#fff;font-size:36px;font-weight:900;display:grid;place-items:center;box-shadow:0 4px 0 #c24f16;font-variant-numeric:tabular-nums;transition:transform .15s}
#count.bump{animation:bump .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.3) rotate(-6deg)}100%{transform:scale(1)}}
#slots{flex:1 1 auto;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;min-width:0}
.slot{aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px #f2d9a6;display:grid;place-items:center;overflow:hidden;position:relative}
.slot svg{width:82%;height:82%;overflow:visible}
.slot.on{box-shadow:inset 0 0 0 3px var(--sun);animation:slotpop .4s cubic-bezier(.3,1.6,.5,1)}
.slot.gone svg{opacity:.25;filter:grayscale(1)}
@keyframes slotpop{0%{transform:scale(.4)}100%{transform:scale(1)}}
#goal{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;line-height:1;color:var(--ink-soft);font-weight:900}
#goal span{font-size:10px;text-transform:uppercase;letter-spacing:.4px}#goal b{font-size:22px;color:var(--ink)}
#choices,#again{display:flex;gap:10px;width:100%;max-width:640px}
#choices[hidden],#again[hidden],#nom[hidden],#progress[hidden]{display:none}
.big{flex:1 1 0;border:0;border-radius:22px;min-height:70px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:#fff;
  background:linear-gradient(#5fd3c9,#1fa89a);box-shadow:0 5px 0 #157d73,0 10px 16px rgba(90,50,20,.18);transition:transform .1s,box-shadow .1s,opacity .2s}
.big .ic{font-size:34px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.big .lb{font-size:20px;font-weight:900;letter-spacing:.3px;text-shadow:0 1px 0 rgba(0,0,0,.25);text-transform:uppercase}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #157d73}
.big.eat{background:linear-gradient(#ff9a5c,#ff5d1f);box-shadow:0 5px 0 #b83d0e,0 10px 16px rgba(90,50,20,.18);animation:eatpulse .8s ease-in-out infinite alternate}
.big.eat:active{box-shadow:0 1px 0 #b83d0e}
@keyframes eatpulse{from{filter:brightness(1)}to{filter:brightness(1.15) }}
.big.done{opacity:.45;animation:none}
#nom{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:900;color:#ff5d1f;text-transform:uppercase;letter-spacing:1px}
#nom .chomp{font-size:40px;animation:chompy .3s ease-in-out infinite alternate}
@keyframes chompy{from{transform:scale(1)}to{transform:scale(1.25) rotate(-8deg)}}
#again .big{background:linear-gradient(#c9a2ff,#8a5cf6);box-shadow:0 5px 0 #5f36b8,0 10px 16px rgba(90,50,20,.18)}

/* ---- foods & crew on the stage ---- */
.food{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform;touch-action:none;cursor:grab}
.food .anim{width:100%;height:100%;transform-origin:50% 100%}
.food svg{width:100%;height:100%;overflow:visible;display:block}
.food.lift{z-index:9000!important}
.food.lift .anim{transform:scale(1.15) translateY(-10px);filter:drop-shadow(0 16px 10px rgba(0,0,0,.28))}
.food.pop .anim{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.food.land .anim{animation:land .4s ease-out}
.food.bite .anim{animation:bitesq .3s ease-out}
@keyframes bitesq{0%{transform:scale(1.1,.85) rotate(-4deg)}100%{transform:scale(1,1)}}
.food.glide{transition:transform .8s cubic-bezier(.4,0,.2,1)}
.food.spit .anim{animation:spitfly .9s ease-in forwards}
@keyframes spitfly{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--sx,500px),-700px) rotate(720deg);opacity:0}}
.food.wobble .anim{animation:wig .4s ease-in-out}
.crew{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform;touch-action:none;cursor:pointer}
.crew .anim{width:100%;height:100%;transform-origin:50% 100%}
.crew svg{width:100%;height:100%;overflow:visible;display:block}
.crew.walk{transition:transform var(--wt,700ms) ease-in-out}
.crew .ov{transform-box:fill-box;transform-origin:50% 100%;transform:scale(var(--full,1));transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.crew .mouth{transform-box:fill-box;transform-origin:50% 50%;transform:scaleY(.3)}
.crew.run .anim{animation:runbob .22s ease-in-out infinite alternate}
@keyframes runbob{from{transform:translateY(0) rotate(-3deg) scale(1.02,.98)}to{transform:translateY(-14px) rotate(3deg) scale(.98,1.03)}}
.crew.run .arm.l{animation:armL .22s ease-in-out infinite alternate}.crew.run .arm.r{animation:armR .22s ease-in-out infinite alternate}
.crew.eat .headg{animation:chomphead .42s ease-in-out infinite}
@keyframes chomphead{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(8deg) translateY(6px)}}
.crew.eat .mouth{animation:mouthopen .42s ease-in-out infinite}
@keyframes mouthopen{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1.1)}}
.crew.eat .arm.l{transform:rotate(-70deg)}.crew.eat .arm.r{transform:rotate(70deg)}
.crew.yum .anim{animation:hop .6s ease-in-out}
.crew.spin .anim{animation:spin 1s cubic-bezier(.4,0,.3,1)}
.crew.shake .anim{animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-6deg)}40%{transform:translateX(12px) rotate(6deg)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
.crew.shake .mouth{transform:scaleY(1.2) translateY(6px)}
.crew.dance .anim{animation:dance .4s ease-in-out infinite alternate;animation-delay:var(--ad,0s)}
.crew.dance .arm.l{animation:armL .4s ease-in-out infinite alternate}.crew.dance .arm.r{animation:armR .4s ease-in-out infinite alternate}
.crew.sleep .anim{animation:snore 2.4s ease-in-out infinite}
.crew.sleep .eyes{animation:none;transform:scaleY(.08)}
.crew.sleep .mouth{transform:scale(.5,.3)}
.crew.hungry .anim{animation:hungry .5s ease-in-out}
@keyframes hungry{0%,100%{transform:scale(1)}30%{transform:scale(1.06,.94)}60%{transform:scale(.96,1.06)}}
.wish{position:absolute;left:0;top:0;width:140px;height:120px;pointer-events:none;transform-origin:50% 100%;z-index:4000;animation:wishbob 1.6s ease-in-out infinite alternate}
@keyframes wishbob{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.wish .bub{position:absolute;inset:0 0 18px 0;background:#fff;border-radius:34px;box-shadow:0 6px 0 rgba(0,0,0,.12);display:grid;place-items:center}
.wish .bub::after{content:"";position:absolute;left:50%;bottom:-16px;width:0;height:0;border:12px solid transparent;border-top-color:#fff;border-bottom:0;transform:translateX(-50%)}
.wish svg{width:72%;height:72%;overflow:visible}
.wish .q{position:absolute;right:10px;top:4px;font-size:26px;font-weight:900;color:#ff5d1f}
.fx.crumb{width:10px;height:10px;border-radius:3px;background:var(--c,#c8894a);animation:crumb .75s ease-in forwards}
@keyframes crumb{0%{transform:translate(var(--x),var(--y)) scale(1);opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy) + 80px)) rotate(200deg) scale(.6);opacity:0}}
.fx.conf{width:12px;height:16px;border-radius:3px;background:var(--c);animation:conf 2.4s ease-in forwards;animation-delay:var(--d,0s);opacity:0}
@keyframes conf{0%{transform:translate(var(--x),-40px) rotate(0);opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),var(--y)) rotate(760deg);opacity:.9}}
.fx.word.shout{font-size:70px}
#tray.lock .tile{opacity:.4;filter:saturate(.3)}
#tray.feed{background:linear-gradient(#fff0b3,#ffd98a)}

/* ---- tray ---- */
#tray{flex:0 0 auto;position:relative;background:linear-gradient(#f3dfb3,#e9c98a);border-top:3px solid #d9b26f;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
#tray.over{background:linear-gradient(#ffd6e3,#ff9fbd)}
#tray.over::before{content:"🧺 put away";position:absolute;left:50%;top:-18px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:4px 14px;font-weight:900;font-size:14px;box-shadow:0 3px 0 #e3c88f}
#trayscroll{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:4px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
#trayscroll::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:78px;height:88px;border-radius:18px;background:linear-gradient(#ffffff,#fff3d6);box-shadow:0 3px 0 #d7b170,inset 0 -6px 0 rgba(0,0,0,.04);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 2px 5px;position:relative;touch-action:pan-x;cursor:grab;transition:transform .15s,opacity .2s}
.tile svg{width:60px;height:60px;overflow:visible;pointer-events:none;margin-bottom:0}
.tile .nm{font-size:10px;font-weight:900;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;letter-spacing:.2px}
.tile.used{opacity:.42;filter:saturate(.3)}
.tile.used::after{content:"✓";position:absolute;right:5px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--grass);color:#fff;font-size:13px;display:grid;place-items:center;font-weight:900}
.tile.wig{animation:wig .4s ease-in-out}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}

/* ghost while dragging from tray */
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:10000;transform-origin:50% 100%;display:none;filter:drop-shadow(0 16px 10px rgba(0,0,0,.3))}
#ghost.on{display:block}
#ghost svg{width:100%;height:100%;overflow:visible}

/* first-run hint */
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:999px;padding:10px 18px;font-weight:900;font-size:15px;color:var(--ink);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;white-space:nowrap;z-index:6000;pointer-events:none;transition:opacity .4s}
#hint .hand{display:inline-block;font-size:24px;animation:handup 1.1s ease-in-out infinite}
@keyframes handup{0%,100%{transform:translateY(6px)}50%{transform:translateY(-10px)}}
#hint.gone{opacity:0}

/* toast */
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%) translateY(-40px);background:#fff;border-radius:16px;padding:10px 16px;font-weight:800;font-size:14px;box-shadow:var(--shadow);z-index:7000;opacity:0;transition:all .3s;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ambient scene animations */
.drift{animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}
.drift2{animation:drift 60s linear infinite;animation-delay:-25s}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flicker{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .18s ease-in-out infinite alternate}
@keyframes flicker{from{transform:scale(1,1);opacity:.9}to{transform:scale(1.15,.9) translateX(1px);opacity:1}}
.glow{animation:glow 1.6s ease-in-out infinite alternate}
.glowsoft{animation:glowsoft 1.3s ease-in-out infinite alternate}
@keyframes glowsoft{from{opacity:.1}to{opacity:.24}}
@keyframes glow{from{opacity:.45}to{opacity:.9}}
.bat{animation:bat 11s linear infinite}
.bat2{animation:bat 15s linear infinite;animation-delay:-6s}
@keyframes bat{0%{transform:translate(-120px,80px)}50%{transform:translate(500px,-20px)}100%{transform:translate(1150px,60px)}}
.bat .w{transform-box:fill-box;transform-origin:50% 50%;animation:flapw .25s ease-in-out infinite alternate}
@keyframes flapw{from{transform:scaleY(1)}to{transform:scaleY(.3)}}
.float{animation:floaty 4s ease-in-out infinite alternate}
@keyframes floaty{from{transform:translateY(-10px)}to{transform:translateY(10px)}}
.bubble{animation:bubble 3s ease-in infinite}
@keyframes bubble{0%{transform:translateY(0) scale(.3);opacity:0}20%{opacity:1}100%{transform:translateY(-70px) scale(1.2);opacity:0}}
.wave1{animation:wavex 6s ease-in-out infinite alternate}
.wave2{animation:wavex 7s ease-in-out infinite alternate-reverse}
@keyframes wavex{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.bob{animation:bob 4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-.6deg)}to{transform:translateY(8px) rotate(.6deg)}}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:flagw 1.4s ease-in-out infinite alternate}
@keyframes flagw{from{transform:skewY(4deg)}to{transform:skewY(-4deg)}}
.twinkle{animation:twinkle 2.2s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.3}to{opacity:1}}
.spinslow{transform-box:fill-box;transform-origin:50% 50%;animation:spinslow 40s linear infinite}
@keyframes spinslow{to{transform:rotate(360deg)}}
.gull{animation:gull 25s linear infinite}
@keyframes gull{from{transform:translate(1100px,0)}to{transform:translate(-200px,-40px)}}

@media (prefers-reduced-motion:reduce){
  .drift,.drift2,.sway,.flicker,.glow,.bat,.bat2,.float,.bubble,.wave1,.wave2,.bob,.flag,.twinkle,.spinslow,.gull,.crew .idle,.crew .wings{animation:none}
}

/* ---- landscape / wide: stage left, controls stacked on the right ---- */
body.land #app{display:grid;grid-template-columns:1fr clamp(250px,32vw,380px);grid-template-rows:auto auto 1fr;grid-template-areas:"top top" "stage actions" "stage tray"}
body.land #topbar{grid-area:top}
body.land #stagewrap{grid-area:stage}
body.land #panel{grid-area:actions;border-top:0;border-left:3px solid var(--panel-edge);padding:8px}
body.land #slots{grid-template-columns:repeat(5,1fr)}
body.land #choices,body.land #again{flex-direction:column}
body.land #tray{grid-area:tray;min-height:0;border-top:0;border-left:3px solid #d9b26f;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
body.land #trayscroll{height:100%;overflow-x:hidden;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));justify-items:center;align-content:start;gap:8px;padding:4px 8px 8px;touch-action:pan-y}
body.land .tile{touch-action:pan-y}
body.land #tray.over::before{top:50%;left:-16px;transform:translate(-100%,-50%)}

</style>
</head>

<div id="app">

</div>

  if(c.hair==='messy') hair=`<path d="M34 ${top+6} L 26 ${top-4} M42 ${top+2} L 40 ${top-12} M50 ${top+1} L 54 ${top-13} M58 ${top+2} L 64 ${top-9} M64 ${top+7} L 74 ${top}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;

  <g class="body-g"><rect x="25" y="${bodyY}" width="50" height="${136-bodyY}" rx="25" fill="url(#${g}y)"/>

  <g class="headg">${hair}<rect x="22" y="${gogY-5}" width="56" height="10" fill="#3a3a44"/>${eyes}
  <g class="mouth"><ellipse cx="50" cy="${mouthY}" rx="12" ry="9" fill="#5a1d22"/><ellipse cx="50" cy="${mouthY+5}" rx="7" ry="4" fill="#ff6b81"/><rect x="40" y="${mouthY-9}" width="20" height="5" rx="2" fill="#fff"/></g>

/* ===================== SOUND (synthesised, no files) ===================== */
const Sfx=(()=>{
  let ctx=null, master=null, muted=false, loop=null;
  const ensure=()=>{ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=.5; master.connect(ctx.destination);}catch(e){ctx=null;} } if(ctx&&ctx.state==='suspended') ctx.resume().catch(()=>{}); return !!ctx && !muted; };

  const noise=(dur,fc0,fc1,g=.3,delay=0)=>{ if(!ensure())return; const t=ctx.currentTime+delay; const n=ctx.sampleRate*dur, buf=ctx.createBuffer(1,n,ctx.sampleRate), d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=buf; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=.8; f.frequency.setValueAtTime(fc0,t); f.frequency.exponentialRampToValueAtTime(fc1,t+dur); const a=ctx.createGain(); a.gain.setValueAtTime(g,t); a.gain.exponentialRampToValueAtTime(.001,t+dur); s.connect(f).connect(a).connect(master); s.start(t); };
  const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
  const api={
    unlock(){ ensure(); },
    get muted(){return muted;},
    setMuted(m){ muted=m; if(m) api.stopLoop(); else ensure(); },
    pop(){ tone(420,880,.14,'sine',.3); tone(880,1320,.1,'triangle',.12,.05); },
    lift(){ tone(300,520,.09,'triangle',.18); },
    poof(){ noise(.35,1800,200,.35); tone(500,120,.3,'sine',.2); },
    boing(d=0){ tone(700,160,.28,'triangle',.3,d); tone(1400,320,.2,'sine',.08,d); },
    land(d=0){ tone(180,60,.16,'sine',.35,d); noise(.12,900,200,.15,d); },
    hop(){ tone(500,900,.12,'triangle',.25); },
    hi(){ tone(660,660,.09,'square',.12); tone(880,990,.14,'square',.12,.1); },
    boo(){ tone(220,660,.25,'sawtooth',.14); tone(440,880,.2,'triangle',.15,.05); },
    giggle(){ [0,.07,.14,.22].forEach((d,i)=>tone(700+i*120,900+i*120,.07,'triangle',.2,d)); },
    zz(){ tone(520,380,.5,'sine',.12); tone(400,300,.6,'sine',.1,.5); },
    whoosh(){ noise(.5,300,3000,.3); },
    spin(){ noise(.45,400,2600,.25); tone(300,1200,.4,'sine',.1); },
    tick(d=0){ tone(900,900,.04,'square',.12,d); },
    sing(i){ const f=PENTA[i%PENTA.length]; tone(f,f*1.01,.28,'triangle',.22); tone(f*2,f*2,.16,'sine',.06); },
    note(i){ tone(PENTA[i%PENTA.length],PENTA[i%PENTA.length],.18,'triangle',.18); },
    chord(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,f,.5,'triangle',.14,i*.03)); },
    startLoop(kind){ api.stopLoop(); if(!ensure())return; const bpm=kind==='march'?120:150, step=60/bpm/2; const mel=[0,2,4,2,0,2,5,4, 0,2,4,5,7,5,4,2]; const bass=[0,0,4,4,2,2,5,5]; let i=0; const play=()=>{ if(!ctx)return; const t=ctx.currentTime; const n=mel[i%mel.length]; tone(PENTA[n],PENTA[n],step*1.2,'triangle',.16,.02); if(i%2===0){ const bn=bass[(i/2)%bass.length]; tone(PENTA[bn]/4,PENTA[bn]/4,step*1.6,'sine',.22,.02);} if(kind==='march' && i%2===0) noise(.06,2000,800,.12,.02); if(i%4===0) noise(.08,6000,3000,.06,.02); i++; }; play(); loop=setInterval(play,step*1000); },
    stopLoop(){ if(loop){ clearInterval(loop); loop=null; } },
    chomp(){ noise(.09,900,250,.35); tone(220,90,.12,'square',.14); },
    crunch(){ noise(.14,2500,500,.4); noise(.1,1800,300,.25,.07); },
    slurp(){ noise(.45,400,2400,.22); tone(300,900,.4,'sine',.08); },
    burp(){ tone(140,70,.42,'sawtooth',.2); tone(90,60,.3,'square',.08,.05); },
    bleh(){ tone(420,160,.45,'sawtooth',.16); noise(.3,600,200,.12,.1); },
    squeak(){ tone(1800,2600,.12,'sine',.18); tone(2600,1800,.12,'sine',.14,.13); },
    rumble(){ tone(70,50,.5,'sawtooth',.18); tone(55,70,.4,'sawtooth',.14,.25); },
    count(i){ const f=PENTA[Math.min(7,i)]||PENTA[7]; tone(f,f,.22,'triangle',.22); tone(f*2,f*2,.12,'sine',.06); },
    fanfare(){ [0,2,4,7,4,7].forEach((n,i)=>tone(PENTA[n],PENTA[n],.22,'triangle',.2,i*.11)); [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,f,.7,'triangle',.14,.66+i*.02)); },
    cheer(){ noise(.6,1500,4000,.18); [0,4,7].forEach((n,i)=>tone(PENTA[n]*2,PENTA[n]*2,.5,'triangle',.12,i*.05)); },
    step(){ noise(.05,700,300,.08); },
  };
  return api;
})();

/* ===================== GAME ===================== */

/* ---------- persistence (per-device convenience only) ---------- */

/* ---------- layout ---------- */

function buildScene(){

let fitT=null; const refit=()=>{ clearTimeout(fitT); fitT=setTimeout(fit,80); };
window.addEventListener('resize',refit); if(window.visualViewport) window.visualViewport.addEventListener('resize',refit); window.addEventListener('orientationchange',refit);

/* ---------- placement helpers (shared by foods and crew) ---------- */
function fromPlacement(o){
  const sh=geo.shelves[Math.min(o.shelf,geo.shelves.length-1)]; o.shelf=geo.shelves.indexOf(sh);
  o.x=sh.x0+(sh.x1-sh.x0)*o.xf; o.y=sh.top+(sh.bottom-sh.top)*o.depth; o.s=sh.s0+(sh.s1-sh.s0)*o.depth;

function toPlacement(o,i,x,y,margin){
  const sh=geo.shelves[i]; const m=margin/(sh.x1-sh.x0);
  o.shelf=i; o.depth=clamp((y-sh.top)/Math.max(1,(sh.bottom-sh.top)),0,1); o.xf=clamp((x-sh.x0)/(sh.x1-sh.x0),m,1-m); fromPlacement(o);
}
function nearestShelf(x,y){ let best=0,bd=1e9; geo.shelves.forEach((sh,i)=>{ const dy=y<sh.top?sh.top-y:(y>sh.bottom?y-sh.bottom:0); const dx=x<sh.x0?sh.x0-x:(x>sh.x1?x-sh.x1:0); const d=Math.hypot(dx*.7,dy); if(d<bd){bd=d;best=i;} }); return best; }
const zOf=o=>o.z ?? (o.state==='drag' ? 9000 : 10+o.shelf*120+Math.round(o.depth*100));

/* ---------- foods ---------- */
function addFood(id,pl,opts={}){

  const anim=document.createElement('div'); anim.className='anim'; anim.innerHTML=drawFood(spec,'f'+id); el.appendChild(anim); layer.appendChild(el);
  const f={id,spec,el,anim,mask:el.querySelector('mask'),bites:0,shelf:pl.shelf??tableIdx,depth:pl.depth??.5,xf:pl.xf??.5,x:0,y:0,s:1,state:'idle'};
  fromPlacement(f); renderFood(f); foods.set(id,f); markTile(id,true);
  if(!opts.noCount){ order.push(id); }
  if(opts.pop){ el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),500); sparkle(f.x,f.y-geo.foodH*.5); }

function removeFood(id,how){ // how: 'eaten' | 'away' | 'silent'

  if(phase==='feast'){ const k=order.indexOf(id); const s=slotsEl.children[k]; if(s) s.classList.add('gone'); }
  else { order=order.filter(x=>x!==id); updatePanel(); save(); }
}
function freeSpot(){
  const sh=geo.shelves[tableIdx]; let best=null,bestD=-1;
  for(let k=0;k<12;k++){ const xf=rnd(.08,.84), depth=rnd(.25,.9); const x=sh.x0+(sh.x1-sh.x0)*xf;
    let d=1e9; for(const f of foods.values()){ if(f.shelf===tableIdx) d=Math.min(d,Math.hypot(f.x-x,(f.depth-depth)*300)); } for(const c of crew.values()){ d=Math.min(d,Math.abs(c.x-x)*.8); }
    if(d>bestD){bestD=d;best={shelf:tableIdx,depth,xf};} }
  return best;
}
const onTable=()=>[...foods.values()].filter(f=>f.state==='idle');

/* ---------- panel ---------- */
function counted(){ const n=order.length; countEl.classList.remove('bump'); void countEl.offsetWidth; countEl.classList.add('bump'); Sfx.count(n-1); if(n<=GOAL) say(NUMS[n]); updatePanel(); if(n===GOAL){ setTimeout(()=>{ Sfx.fanfare(); confetti(); bigWord('SNACK TIME!'); say('Snack time!'); },500); } }

  const n=order.length; countEl.textContent=n;
  slotsEl.innerHTML=order.map(id=>`<div class="slot on">${drawFood(foodSpec(id),'s'+id)}</div>`).join('')+'<div class="slot"></div>'.repeat(Math.max(0,GOAL-n));
  if(phase==='feast') return;
  const ready=n>=GOAL; phase=ready?'ready':'pick';
  progressEl.hidden=ready; choicesEl.hidden=!ready; nomEl.hidden=true; againEl.hidden=true;
  lineupBtn.classList.remove('done'); tray.classList.toggle('lock',ready); showWish(true);
}
lineupBtn.addEventListener('click',()=>{ if(phase!=='ready') return; Sfx.unlock(); lineUp(); });
eatBtn.addEventListener('click',()=>{ if(phase!=='ready') return; Sfx.unlock(); feast(); });
againBtn.addEventListener('click',()=>{ Sfx.unlock(); Sfx.pop(); updatePanel(); toast('Pick 10 more snacks!'); });

/* ---------- fx ---------- */
function spawn(cls,x,y,txt,dx=0,dy=0,extra=''){ const e=document.createElement('span'); e.className='fx '+cls; e.style.cssText=`--x:${x}px;--y:${y}px;--dx:${dx}px;--dy:${dy}px;${extra}`; if(txt) e.textContent=txt; fxLayer.appendChild(e); e.addEventListener('animationend',()=>e.remove()); setTimeout(()=>e.remove(),3200); }
function sparkle(x,y){ for(let i=0;i<7;i++){ const a=rnd(0,Math.PI*2), d=rnd(50,120); spawn('spark',x-7,y-7,'',Math.cos(a)*d,Math.sin(a)*d); } }
function puff(x,y){ for(let i=0;i<5;i++){ const a=rnd(0,Math.PI*2), d=rnd(20,70); spawn('puff',x-20,y-20,'',Math.cos(a)*d,Math.sin(a)*d-20); } }

function hearts(o){ for(let i=0;i<3;i++) spawn('heart',o.x+rnd(-30,30),o.y-geo.crewH*.9,'💗',rnd(-40,40)); }
function word(o,t,top){ spawn('word',o.x-40,o.y-(top||geo.crewH*(o.s||1))-16,t); }
function bigWord(t){ spawn('word shout',500-170,H*.40,t); }

function say(text){ try{ if(Sfx.muted||!('speechSynthesis' in window)) return; const u=new SpeechSynthesisUtterance(text); u.rate=.95; u.pitch=1.3; u.volume=.9; speechSynthesis.speak(u); }catch(e){} }
let toastT=null; function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('on'),1800); }

/* ---------- hand feeding (drop a snack on a crew member) ---------- */
function crewAt(px,py){ for(const c of crew.values()){ if(c.state!=='idle') continue; const w=geo.crewH*100/150*c.s, h=geo.crewH*c.s; if(Math.abs(px-c.x)<w*.7 && py<c.y+20 && py>c.y-h*1.1) return c; } return null; }

/* ---------- eating ---------- */
const BITES=[{x:70,y:30,r:24},{x:32,y:42,r:24},{x:56,y:72,r:30}], SIPS=[{x:50,y:22,r:28},{x:50,y:50,r:28},{x:50,y:80,r:32}];
function addBite(f,b,drink){ const p=(drink?SIPS:BITES)[b]; f.mask.insertAdjacentHTML('beforeend',`<circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="#000"/>`); }
async function chomp(c,f){
  if(!foods.has(f.id)) return; f.state='eating'; c.state='eat'; markTile(f.id,true);
  f.el.classList.add('glide'); f.x=c.x+8; f.y=c.y-geo.crewH*c.s*.42; f.z=zOf(c)+1; renderFood(f); await wait(330); f.el.classList.remove('glide');
  if(f.spec.kind==='silly'){
    Sfx.chomp(); c.el.classList.add('eat'); await wait(460); c.el.classList.remove('eat');
    Sfx.bleh(); if(f.spec.id==='duck') Sfx.squeak(); word(c,'BLEH!'); say('Bleh!'); c.el.classList.add('shake');
    f.el.style.setProperty('--sx',(f.x<500?-700:700)+'px'); f.el.classList.add('spit'); f.state='spit';
    await wait(600); c.el.classList.remove('shake'); await wait(350); removeFood(f.id,'eaten'); c.state='idle'; return;

function react(c,spec){
  const k=spec.kind;
  if(spec.fav){ word(c,'YAY!'); hearts(c); Sfx.cheer(); c.el.classList.add('spin'); setTimeout(()=>c.el.classList.remove('spin'),1000); return; }
  if(k==='fruit'){ word(c,'Yum!'); hearts(c); }
  else if(k==='veg'){ word(c,'Crunch!'); }
  else if(k==='sweet'){ word(c,'Mmm!'); c.el.classList.add('yum'); setTimeout(()=>c.el.classList.remove('yum'),650); }
  else if(k==='drink'){ word(c,'Ahh!'); }
  else { word(c,'Nom!'); }
}

/* ---------- line up ---------- */
function lineUp(){
  const L=onTable().sort((a,b)=>a.x-b.x); if(!L.length) return;
  const n=L.length, rows=n>6?2:1, front=rows===2?Math.ceil(n/2):n;
  L.forEach((f,i)=>{ const inFront=i<front; const j=inFront?i:i-front, rowN=inFront?front:n-front;
    f.shelf=tableIdx; f.depth=inFront?.86:.18; f.xf=.06+.88*((j+(inFront?.5:1))/(rowN+(inFront?0:1))); fromPlacement(f);
    f.el.classList.add('glide'); renderFood(f); setTimeout(()=>f.el.classList.remove('glide'),900); setTimeout(()=>Sfx.tick(),i*70); });
  setTimeout(()=>{ Sfx.chord(); L.forEach(f=>sparkle(f.x,f.y-geo.foodH*.5)); },900);
  lineupBtn.classList.add('done'); save();
}

/* ---------- the feast ---------- */
async function feast(){
  phase='feast'; choicesEl.hidden=true; nomEl.hidden=false; tray.classList.add('lock'); showWish(false);
  const sh=geo.shelves[tableIdx];
  const members=CREW.map(spec=>spawnCrew(spec));
  // everyone runs in from the sides and spreads out along the table
  await Promise.all(members.map((m,i)=>{ if(m.id==='gus' && m.state==='idle'){ return walkTo(m,sh.x0+(sh.x1-sh.x0)*((i+.5)/members.length),.35,800); }
    const fromLeft=i%2===0; m.shelf=tableIdx; m.depth=.35; m.xf=fromLeft?-.15:1.15; fromPlacement(m); m.el.style.setProperty('--wt','0ms'); renderCrew(m);
    return wait(i*140).then(()=>walkTo(m,sh.x0+(sh.x1-sh.x0)*((i+.5)/members.length),.35,900)); }));
  Sfx.cheer(); members.forEach(m=>word(m,['Yum!','Food!','Snacks!','Nom!','Yay!','Ooh!'][Math.floor(Math.random()*6)]));
  await wait(500);
  const L=onTable().sort((a,b)=>a.x-b.x); const queues=members.map(()=>[]); L.forEach((f,k)=>queues[k%members.length].push(f));
  await Promise.all(members.map(async(m,i)=>{ for(const f of queues[i]){ if(!foods.has(f.id)||f.state!=='idle') continue; m.shelf=f.shelf; await walkTo(m,f.x+(f.depth<.5?-26:26),clamp(f.depth-.14,0,1),650); await chomp(m,f); } if(m.full>0){ await wait(200); Sfx.burp(); word(m,'Burp!'); m.el.classList.add('yum'); await wait(650); m.el.classList.remove('yum'); } }));
  // anything left (dropped mid-feast) gets eaten by whoever is free
  for(const f of onTable()){ const m=members[Math.floor(Math.random()*members.length)]; m.shelf=f.shelf; await walkTo(m,f.x-6,clamp(f.depth-.14,0,1),600); await chomp(m,f); }
  // celebrate, nap, leave
  Sfx.fanfare(); confetti(); bigWord('ALL GONE!'); say('All gone! Yummy!'); members.forEach(m=>m.el.classList.add('dance')); await wait(2400); members.forEach(m=>m.el.classList.remove('dance'));
  members.forEach(m=>m.el.classList.add('sleep')); Sfx.zz(); const zzT=setInterval(()=>{ const m=members[Math.floor(Math.random()*members.length)]; spawn('zz',m.x+20,m.y-geo.crewH*m.s,['z','Zz','ZZZ'][Math.floor(Math.random()*3)]); },700);
  await wait(3000); clearInterval(zzT); members.forEach(m=>m.el.classList.remove('sleep')); Sfx.hi();
  await Promise.all(members.map((m,i)=>{ m.full=0; m.el.style.setProperty('--full','1'); if(m.id==='gus'){ m.shelf=tableIdx; return walkTo(m,sh.x0+(sh.x1-sh.x0)*.9,.22,900); } m.shelf=tableIdx; return wait(i*100).then(()=>walkTo(m,m.x<500?-150:1150,m.depth,900,true)).then(()=>removeCrew(m.id)); }));
  // new round
  order=[]; phase='pick'; nomEl.hidden=true; progressEl.hidden=true; choicesEl.hidden=true; againEl.hidden=false; countEl.textContent='0'; tray.classList.remove('lock'); newWish(); showWish(true); save();
}

/* ---------- pointer: stage ---------- */
let drag=null, trayDrag=null;
const toStage=e=>({x:(e.clientX-stageRect.left)/scale,y:(e.clientY-stageRect.top)/scale});
function beginDrag(f,e,offX,offY,fromTray){
  stageRect=stage.getBoundingClientRect(); f.state='drag'; f.el.classList.add('lift');
  drag={f,offX,offY,sx:e.clientX,sy:e.clientY,moved:false,fromTray,overTray:false,target:null}; hintEl.classList.add('on'); Sfx.lift(); moveDrag(e);
}
function moveDrag(e){
  const f=drag.f; const pt=toStage(e);
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8) drag.moved=true;
  f.x=pt.x+drag.offX; f.y=pt.y+drag.offY; f.s=1; renderFood(f);
  const tr=tray.getBoundingClientRect(); const over=land ? e.clientX>tr.left-10 : e.clientY>tr.top-10;
  if(over!==drag.overTray){ drag.overTray=over; tray.classList.toggle('over',over); }
  const t=phase==='feast'?null:crewAt(pt.x,pt.y); if(t!==drag.target){ if(drag.target) drag.target.el.classList.remove('hungry'); drag.target=t; if(t){ t.el.classList.add('hungry'); Sfx.rumble(); } }
  const n=nearestShelf(f.x,f.y); hintEl.querySelectorAll('.zone').forEach(z=>z.classList.toggle('near',+z.dataset.i===n && !over && !t));
}
function endDrag(e,cancel){
  const d=drag; drag=null; const f=d.f; f.el.classList.remove('lift'); hintEl.classList.remove('on'); hintEl.querySelectorAll('.zone').forEach(z=>z.classList.remove('near')); tray.classList.remove('over'); if(d.target) d.target.el.classList.remove('hungry');
  if(!d.moved && !d.fromTray && !cancel){ f.state='idle'; fromPlacement(f); renderFood(f); f.el.classList.add('wobble'); setTimeout(()=>f.el.classList.remove('wobble'),450); Sfx.hop(); say(f.spec.n); return; }
  if(d.overTray || cancel){ f.state='idle'; removeFood(f.id, cancel&&d.fromTray ? 'silent' : 'away'); return; }
  if(d.target && d.target.state==='idle'){ feed(d.target,f); return; }
  const pt=toStage(e); const fx=pt.x+d.offX, fy=pt.y+d.offY; const i=nearestShelf(fx,fy);
  toPlacement(f,i,fx,fy,geo.foodH*.35); f.state='idle'; renderFood(f);
  f.el.classList.add('land'); setTimeout(()=>f.el.classList.remove('land'),450); Sfx.pop(); sparkle(f.x,f.y-geo.foodH*.4);
  if(d.fromTray && !order.includes(f.id)){ order.push(f.id); counted(); dismissHint(); } save();
}
layer.addEventListener('pointerdown',e=>{
  const ce=e.target.closest('.crew'); if(ce){ const c=crew.get(ce.dataset.id); if(c){ e.preventDefault(); Sfx.unlock(); tapCrew(c); } return; }
  const el=e.target.closest('.food'); if(!el||drag||trayDrag) return;
  const f=foods.get(el.dataset.id); if(!f||f.state!=='idle'||phase==='feast') return;
  e.preventDefault(); Sfx.unlock(); stageRect=stage.getBoundingClientRect(); const pt=toStage(e); beginDrag(f,e,f.x-pt.x,f.y-pt.y,false);
});
window.addEventListener('pointermove',e=>{
  if(drag){ moveDrag(e); return; }
  if(trayDrag && !trayDrag.started){ const dx=e.clientX-trayDrag.x0, dy=e.clientY-trayDrag.y0;
    const pull = land ? (dx<-14 && Math.abs(dx)>Math.abs(dy)) : (dy<-14 && Math.abs(dy)>Math.abs(dx)); const scrolls = land ? Math.abs(dy)>12 : Math.abs(dx)>12;
    if(pull){ trayDrag.started=true; startTrayDrag(e); } else if(scrolls) trayDrag=null; }
},{passive:true});
const up=e=>{ if(drag) endDrag(e,e.type==='pointercancel'); if(trayDrag){ if(!trayDrag.started && e.type!=='pointercancel' && Math.hypot(e.clientX-trayDrag.x0,e.clientY-trayDrag.y0)<10) tapTile(trayDrag.id); trayDrag=null; } };
window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up); window.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- tray ---------- */
function buildTray(){ trayScroll.innerHTML=FOODS.map(f=>`<div class="tile" data-id="${f.id}">${drawFood(f,'t'+f.id)}<span class="nm">${f.n}</span></div>`).join(''); }
function markTile(id,used){ const t=trayScroll.querySelector(`.tile[data-id="${id}"]`); if(t) t.classList.toggle('used',!!used); }
function wiggleTile(id){ const t=trayScroll.querySelector(`.tile[data-id="${id}"]`); if(t){ t.classList.remove('wig'); void t.offsetWidth; t.classList.add('wig'); } }
function trayLocked(){ if(phase==='feast'){ toast('Wait, they are eating!'); return true; } if(order.length>=GOAL){ toast('The table is full! Line up or eat!'); return true; } return false; }
trayScroll.addEventListener('pointerdown',e=>{ const t=e.target.closest('.tile'); if(!t||drag) return; Sfx.unlock(); trayDrag={id:t.dataset.id,x0:e.clientX,y0:e.clientY,started:false}; });
function startTrayDrag(e){ const id=trayDrag.id; trayDrag=null; if(foods.has(id)){ wiggleTile(id); const f=foods.get(id); f.el.classList.add('wobble'); setTimeout(()=>f.el.classList.remove('wobble'),450); return; } if(trayLocked()){ wiggleTile(id); return; }
  stageRect=stage.getBoundingClientRect(); const f=addFood(id,{shelf:tableIdx,depth:.5,xf:.5},{quiet:true,noCount:true}); beginDrag(f,e,land?-geo.foodH*.3:0,land?geo.foodH*.3:geo.foodH*.6,true); }
function tapTile(id){ if(foods.has(id)){ wiggleTile(id); const f=foods.get(id); f.el.classList.add('wobble'); setTimeout(()=>f.el.classList.remove('wobble'),450); Sfx.hop(); return; } if(trayLocked()){ wiggleTile(id); return; }
  const f=addFood(id,freeSpot(),{pop:true}); if(f){ Sfx.pop(); } }

/* ---------- scenes & top bar ---------- */
function buildTabs(){ tabsEl.innerHTML=SCENES.map((s,i)=>`<button class="tab${s===scene?' on':''}" data-i="${i}" aria-label="${s.name}"><span class="ic">${s.icon}</span><span class="lb">${s.short||s.name}</span></button>`).join(''); }
tabsEl.addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(!b) return; setScene(SCENES[+b.dataset.i]); });
function setScene(s){ if(s===scene||phase==='feast') return; save(); for(const id of [...foods.keys()]) removeFood(id,'silent'); order=[]; scene=s; buildTabs(); fit(); restore(); Sfx.whoosh(); updatePanel(true); save(); }
function restore(){ const pl=state.foods[scene.id]||[]; pl.forEach(it=>{ if(foodSpec(it.id)) addFood(it.id,it,{quiet:true}); }); updatePanel(true); }
const soundBtn=$('#soundbtn'); function paintSound(){ soundBtn.textContent=state.muted?'🔇':'🔊'; soundBtn.classList.toggle('off',state.muted); }
soundBtn.addEventListener('click',()=>{ state.muted=!state.muted; Sfx.setMuted(state.muted); if(!state.muted) Sfx.pop(); paintSound(); save(); });
const bin=$('#bin'); let holdT=null;
const holdStart=e=>{ e.preventDefault(); if(phase==='feast') return; if(!foods.size){ toast('The table is already empty'); return; } bin.classList.add('hold'); holdT=setTimeout(()=>{ bin.classList.remove('hold'); for(const id of [...foods.keys()]) removeFood(id,'away'); order=[]; updatePanel(); toast('All cleared!'); },1100); };
const holdEnd=()=>{ bin.classList.remove('hold'); clearTimeout(holdT); };
bin.addEventListener('pointerdown',holdStart); bin.addEventListener('pointerup',holdEnd); bin.addEventListener('pointercancel',holdEnd); bin.addEventListener('pointerleave',holdEnd);

/* ---------- boot ---------- */
document.addEventListener('visibilitychange',()=>{ if(document.hidden) Sfx.stopLoop(); });
Sfx.setMuted(!!state.muted); paintSound();
scene=SCENES.find(s=>s.id===state.scene)||SCENES[0];
buildTabs(); buildTray(); fit();
const gus=spawnCrew(crewSpec('gus')); gusHome(gus); fromPlacement(gus); renderCrew(gus); newWish();
if(state.foods[scene.id]) restore();
else { [['banana',.2,.7],['cookie',.6,.3],['apple',.5,.5]].forEach(([id,xf,depth])=>addFood(id,{shelf:tableIdx,depth,xf},{quiet:true})); updatePanel(true); }
if(state.hinted) firstHint.remove();
try{ if(navigator.wakeLock) document.addEventListener('pointerdown',()=>navigator.wakeLock.request('screen').catch(()=>{}),{once:true}); }catch(e){}
window.__sp={foods,crew,get order(){return order;},get phase(){return phase;},get geo(){return geo;},feast,lineUp,addFood,removeFood,setScene,get wish(){return wish;}};
})();

if('serviceWorker' in navigator && location.protocol==='https:'){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
</body>
