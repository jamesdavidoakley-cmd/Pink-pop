name: king-hunt-release
on:
  push:
    tags: ['king-hunt-v*']
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: king-hunt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: king-hunt-${{ matrix.os }}
          path: |
            king-hunt/release/*.exe
            king-hunt/release/*.dmg
            king-hunt/release/*.AppImage
