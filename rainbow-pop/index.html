<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#ff6fb1" />
<title>Rainbow Pop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff6fb1'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23ffd23f'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%2334c6ff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" />
<style>
:root {
  --pink: #ff6fb1; --orange: #ff9f43; --yellow: #ffd23f; --green: #3ddc84; --blue: #34c6ff; --purple: #a56cff; --red: #ff5a5f;
  --ink: #2b1b4d; --paper: #fff8f0;
  --font: 'Fredoka', 'Nunito', 'Arial Rounded MT Bold', 'Segoe UI Rounded', system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; font-family: var(--font); color: var(--ink); background: var(--paper); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
body { background: linear-gradient(160deg, #ffe3f1 0%, #fff3d6 35%, #dff8ff 70%, #eadcff 100%); }
button { font-family: inherit; border: 0; cursor: pointer; color: inherit; }
[hidden] { display: none !important; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom)); }

/* Bubbles drifting in the background */
.bubble { position: fixed; border-radius: 50%; opacity: 0.35; pointer-events: none; animation: drift linear infinite; z-index: -1; }
@keyframes drift { from { transform: translateY(110vh) scale(1); } to { transform: translateY(-20vh) scale(1.3); } }

/* Home */
#home { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; position: relative; z-index: 1; }
#home h1 { margin: 0; font-size: clamp(44px, 9vw, 96px); font-weight: 700; letter-spacing: 0.04em; line-height: 1; }
#home h1 span { display: inline-block; animation: bob 1.6s ease-in-out infinite; }
#home h1 span:nth-child(2n) { animation-delay: 0.2s; }
#home h1 span:nth-child(3n) { animation-delay: 0.4s; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
#home .sub { margin: 0; font-size: clamp(18px, 3vw, 28px); font-weight: 500; opacity: 0.8; }
#modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; width: min(900px, 100%); }
.mode { aspect-ratio: 1; border-radius: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: clamp(18px, 2.6vw, 26px); font-weight: 700; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.15); box-shadow: 0 10px 0 rgba(0,0,0,0.12), 0 16px 30px rgba(0,0,0,0.12); transition: transform 0.12s; }
.mode .big { font-size: clamp(48px, 7vw, 84px); line-height: 1; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.12)); }
.mode:active { transform: translateY(6px) scale(0.98); box-shadow: 0 4px 0 rgba(0,0,0,0.12); }
#total { font-size: clamp(16px, 2.4vw, 22px); font-weight: 700; color: #7a4bd1; }
.tiny { position: fixed; top: 12px; right: 12px; width: 52px; height: 52px; border-radius: 18px; background: rgba(255,255,255,0.7); font-size: 24px; z-index: 5; box-shadow: 0 4px 0 rgba(0,0,0,0.08); }
.tiny.left { right: auto; left: 12px; }

/* Play */
#play { flex: 1; display: none; flex-direction: column; align-items: stretch; gap: 10px; position: relative; z-index: 1; }
#play.on { display: flex; }
#stars { display: flex; justify-content: center; gap: 8px; margin-top: 56px; }
#stars span { font-size: clamp(26px, 4vw, 40px); filter: grayscale(1) opacity(0.35); transition: transform 0.3s, filter 0.3s; }
#stars span.lit { filter: none; animation: pop 0.5s; }
@keyframes pop { 0% { transform: scale(0.3) rotate(-30deg); } 60% { transform: scale(1.4) rotate(10deg); } 100% { transform: scale(1); } }
#prompt { display: flex; align-items: center; justify-content: center; gap: 12px; }
#prompt-text { font-size: clamp(24px, 4.2vw, 44px); font-weight: 700; text-align: center; text-wrap: balance; }
#btn-say { width: 60px; height: 60px; border-radius: 50%; background: #fff; font-size: 28px; box-shadow: 0 6px 0 rgba(0,0,0,0.1); flex: 0 0 auto; }
#btn-say:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }
#stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 120px; }
#card { background: #fff; border-radius: 40px; padding: 10px 40px; min-width: 40%; text-align: center; box-shadow: 0 14px 0 rgba(0,0,0,0.08), 0 20px 40px rgba(0,0,0,0.1); font-size: clamp(90px, 20vh, 220px); font-weight: 700; line-height: 1.1; transition: transform 0.2s; }
#card.small { font-size: clamp(40px, 9vh, 96px); }
#card.tap { cursor: pointer; }
#card.tap:active { transform: scale(0.96); }
#card .sub { display: block; font-size: clamp(22px, 4vh, 44px); font-weight: 700; color: #7a4bd1; margin-top: 4px; }
#card .sum { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
#card .sum .grp { font-size: clamp(40px, 9vh, 90px); letter-spacing: -0.1em; }
#card .sum .op { font-size: clamp(50px, 10vh, 100px); color: var(--pink); }
#choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; height: clamp(120px, 26vh, 220px); }
.choice { border-radius: 32px; font-size: clamp(48px, 12vh, 120px); font-weight: 700; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,0.15); box-shadow: 0 10px 0 rgba(0,0,0,0.14); transition: transform 0.12s; display: flex; align-items: center; justify-content: center; line-height: 1; }
.choice.word { font-size: clamp(30px, 7vh, 72px); letter-spacing: 0.06em; }
.choice:active { transform: translateY(6px) scale(0.98); box-shadow: 0 4px 0 rgba(0,0,0,0.14); }
.choice.wrong { animation: shake 0.5s; filter: saturate(0.4); }
.choice.right { animation: bounce 0.7s; }
.choice.hint { animation: pulse 0.9s ease-in-out infinite; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-14px) rotate(-3deg); } 60% { transform: translateX(14px) rotate(3deg); } }
@keyframes bounce { 0% { transform: scale(1); } 30% { transform: scale(1.15) rotate(-4deg); } 60% { transform: scale(0.95) rotate(3deg); } 100% { transform: scale(1); } }
@keyframes pulse { 50% { transform: scale(1.06); box-shadow: 0 10px 0 rgba(0,0,0,0.14), 0 0 40px 10px rgba(255,255,255,0.7); } }
#mic { align-self: center; padding: 10px 22px; border-radius: 999px; background: #fff; font-size: 20px; font-weight: 700; box-shadow: 0 6px 0 rgba(0,0,0,0.1); }
#mic.listening { background: var(--yellow); animation: pulse 0.8s infinite; }

/* Win overlay */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
#cheer { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; z-index: 21; pointer-events: none; }
#cheer.on { display: flex; }
#cheer .big { font-size: clamp(60px, 12vw, 140px); font-weight: 700; color: #fff; text-shadow: 0 6px 0 rgba(0,0,0,0.2), 0 0 40px rgba(255,255,255,0.8); animation: pop 0.6s; }
#cheer .emoji { font-size: clamp(90px, 20vw, 220px); animation: bounce 1s infinite; }

@media (max-width: 600px) {
  #choices { gap: 8px; }
  .choice { border-radius: 22px; }
  #card { padding: 6px 20px; border-radius: 28px; }
  #stars { margin-top: 62px; }
}
@media (prefers-reduced-motion: reduce) { #home h1 span, .bubble, #cheer .emoji, .choice.hint, #mic.listening { animation: none; } }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">
  <button id="btn-home" class="tiny left" hidden aria-label="Home">🏠</button>
  <button id="btn-mute" class="tiny" aria-label="Sound">🔊</button>

  <div id="home">
    <h1 id="title"></h1>
    <p class="sub">Tap a game, Cas!</p>
    <div id="modes"></div>
    <div id="total"></div>
  </div>

  <div id="play">
    <div id="stars"></div>
    <div id="prompt"><div id="prompt-text"></div><button id="btn-say" aria-label="Say it again">🔊</button></div>
    <div id="stage"><div id="card"></div></div>
    <button id="mic" hidden>🎤 Say it and I'll listen</button>
    <div id="choices"></div>
  </div>
</div>
<div id="cheer"><div class="emoji" id="cheer-emoji">🎉</div><div class="big" id="cheer-text">YES!</div></div>

<script>
// ---------- content ----------
const LETTERS = {
  A: ['apple', '🍎'], B: ['ball', '⚽'], C: ['cat', '🐱'], D: ['dog', '🐶'], E: ['egg', '🥚'], F: ['fish', '🐟'], G: ['goat', '🐐'],
  H: ['house', '🏠'], I: ['ice cream', '🍦'], J: ['jelly', '🍮'], K: ['kite', '🪁'], L: ['lion', '🦁'], M: ['moon', '🌙'], N: ['nose', '👃'],
  O: ['orange', '🍊'], P: ['pig', '🐷'], Q: ['queen', '👸'], R: ['rainbow', '🌈'], S: ['sun', '☀️'], T: ['tree', '🌳'], U: ['umbrella', '☂️'],
  V: ['van', '🚐'], W: ['whale', '🐳'], X: ['x-ray', '🩻'], Y: ['yo-yo', '🪀'], Z: ['zebra', '🦓'],
};
const WORDS = [['dog', '🐶'], ['cat', '🐱'], ['sun', '☀️'], ['bus', '🚌'], ['hat', '🎩'], ['cup', '☕'], ['pig', '🐷'], ['bed', '🛏️'], ['car', '🚗'], ['egg', '🥚'], ['cow', '🐮'], ['bee', '🐝'], ['box', '📦'], ['pen', '🖊️'], ['bat', '🦇'], ['fox', '🦊'], ['map', '🗺️'], ['jam', '🍓'], ['hen', '🐔'], ['ant', '🐜']];
const PICTURES = [['house', '🏠'], ['car', '🚗'], ['tree', '🌳'], ['dog', '🐶'], ['cat', '🐱'], ['ball', '⚽'], ['apple', '🍎'], ['sun', '☀️'], ['moon', '🌙'], ['star', '⭐'], ['fish', '🐟'], ['bird', '🐦'], ['flower', '🌸'], ['boat', '⛵'], ['bus', '🚌'], ['train', '🚂'], ['plane', '✈️'], ['cake', '🎂'], ['banana', '🍌'], ['duck', '🦆'], ['frog', '🐸'], ['cow', '🐮'], ['hat', '🎩'], ['shoe', '👟'], ['book', '📚'], ['bike', '🚲'], ['rabbit', '🐰'], ['elephant', '🐘']];
const COUNT_THINGS = ['🦆', '🍎', '⭐', '🐸', '🎈', '🍪', '🐟', '🚗'];
const COLORS = ['var(--pink)', 'var(--orange)', 'var(--green)', 'var(--blue)', 'var(--purple)', 'var(--red)', 'var(--yellow)'];
const CHEERS = ['YES!', 'WOW!', 'SUPER!', 'HOORAY!', 'BRILLIANT!', 'YAY!'];
const CHEER_EMOJI = ['🎉', '🌟', '🦄', '🐬', '🎈', '🚀', '🍭', '🐥'];
const MODES = [
  { id: 'letters', name: 'Letters', icon: '🔤', color: 'var(--pink)' },
  { id: 'say', name: 'Say it', icon: '🗣️', color: 'var(--purple)' },
  { id: 'words', name: 'Words', icon: '📖', color: 'var(--green)' },
  { id: 'pictures', name: 'Pictures', icon: '🖼️', color: 'var(--orange)' },
  { id: 'numbers', name: 'Numbers', icon: '🔢', color: 'var(--blue)' },
];
const ROUNDS = 5;

// ---------- tiny helpers ----------
const $ = (id) => document.getElementById(id);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
let muted = false;
try { muted = localStorage.getItem('rainbow-pop-muted') === '1'; } catch {}
let total = 0;
try { total = Number(localStorage.getItem('rainbow-pop-total') || 0); } catch {}

// ---------- sound: tiny synth + speech ----------
let ac = null;
function ctx() { if (!ac && 'AudioContext' in window) ac = new AudioContext(); if (ac && ac.state === 'suspended') ac.resume(); return ac; }
function tone(f, start, dur, type = 'sine', gain = 0.15, slide) {
  const c = ctx(); if (!c || muted) return;
  const o = c.createOscillator(); const g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, c.currentTime + start);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, c.currentTime + start + dur);
  g.gain.setValueAtTime(0.0001, c.currentTime + start);
  g.gain.exponentialRampToValueAtTime(gain, c.currentTime + start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
  o.connect(g).connect(c.destination); o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
}
function noise(start, dur, gain = 0.2) {
  const c = ctx(); if (!c || muted) return;
  const buf = c.createBuffer(1, c.sampleRate * dur, c.sampleRate); const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = c.createBufferSource(); s.buffer = buf; const g = c.createGain(); g.gain.value = gain;
  s.connect(g).connect(c.destination); s.start(c.currentTime + start);
}
const sfx = {
  tap() { tone(600, 0, 0.08, 'sine', 0.12, 900); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.35, 'triangle', 0.16)); },
  big() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * 0.1, 0.5, 'triangle', 0.16)); [262, 330, 392].forEach((f, i) => tone(f, i * 0.1, 1.0, 'sine', 0.1)); },
  no() { tone(300, 0, 0.2, 'sine', 0.1, 220); },
  whistle() { tone(600, 0, 0.5, 'sine', 0.05, 1800); },
  boom() { noise(0, 0.5, 0.25); tone(90, 0, 0.4, 'sine', 0.2, 40); },
};
function speak(text, rate = 0.92) {
  if (muted || !('speechSynthesis' in window)) return;
  const s = window.speechSynthesis; s.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; u.rate = rate; u.pitch = 1.15;
  const voices = s.getVoices();
  const v = voices.find((x) => /en-GB/i.test(x.lang) && /female|Google UK English Female|Libby|Sonia/i.test(x.name)) || voices.find((x) => /en-GB/i.test(x.lang)) || voices.find((x) => /^en/i.test(x.lang));
  if (v) u.voice = v;
  s.speak(u);
}
if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }

// ---------- fireworks + confetti ----------
const fx = $('fx'); const fctx = fx.getContext('2d');
let parts = []; let rockets = []; let confetti = [];
function sizeFx() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; fctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
sizeFx(); addEventListener('resize', sizeFx);
const HUES = [340, 30, 50, 140, 195, 265, 0];
function launch(n) {
  for (let i = 0; i < n; i++) rockets.push({ x: innerWidth * (0.15 + Math.random() * 0.7), y: innerHeight + 10, vx: (Math.random() - 0.5) * 2, vy: -(9 + Math.random() * 5), hue: pick(HUES), fuse: 0.9 + Math.random() * 0.6, t: 0 });
  sfx.whistle();
}
function explode(x, y, hue) {
  const n = 70 + Math.floor(Math.random() * 50);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2; const sp = 2 + Math.random() * 5;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, hue: hue + (Math.random() - 0.5) * 30, r: 2 + Math.random() * 2, trail: [] });
  }
  sfx.boom();
}
function dropConfetti(n) {
  for (let i = 0; i < n; i++) confetti.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.5, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3, w: 8 + Math.random() * 8, h: 6 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, hue: pick(HUES) });
}
let lastFx = performance.now();
function fxLoop(now) {
  const dt = Math.min(0.05, (now - lastFx) / 1000) * 60; lastFx = now;
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i]; r.t += dt / 60; r.x += r.vx * dt; r.y += r.vy * dt; r.vy += 0.12 * dt;
    fctx.fillStyle = `hsl(${r.hue} 100% 70%)`; fctx.beginPath(); fctx.arc(r.x, r.y, 3, 0, Math.PI * 2); fctx.fill();
    if (r.t > r.fuse || r.vy > -1) { explode(r.x, r.y, r.hue); rockets.splice(i, 1); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.trail.push([p.x, p.y]); if (p.trail.length > 6) p.trail.shift();
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.08 * dt; p.vx *= 0.985; p.vy *= 0.985; p.life -= 0.012 * dt;
    fctx.strokeStyle = `hsla(${p.hue} 100% 65% / ${p.life})`; fctx.lineWidth = p.r; fctx.lineCap = 'round';
    fctx.beginPath(); fctx.moveTo(p.trail[0][0], p.trail[0][1]); fctx.lineTo(p.x, p.y); fctx.stroke();
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i]; c.x += c.vx * dt + Math.sin(c.y / 30) * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
    fctx.save(); fctx.translate(c.x, c.y); fctx.rotate(c.rot); fctx.fillStyle = `hsl(${c.hue} 95% 60%)`; fctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); fctx.restore();
    if (c.y > innerHeight + 30) confetti.splice(i, 1);
  }
  requestAnimationFrame(fxLoop);
}
requestAnimationFrame(fxLoop);
async function celebrate(bigShow) {
  $('cheer-text').textContent = pick(CHEERS); $('cheer-emoji').textContent = pick(CHEER_EMOJI);
  $('cheer').classList.add('on');
  launch(bigShow ? 6 : 3); dropConfetti(bigShow ? 160 : 60);
  await wait(700); launch(bigShow ? 5 : 2);
  if (bigShow) { await wait(700); launch(6); await wait(700); launch(6); dropConfetti(120); }
  await wait(bigShow ? 1800 : 900);
  $('cheer').classList.remove('on');
}

// ---------- background bubbles ----------
for (let i = 0; i < 14; i++) {
  const b = document.createElement('div'); b.className = 'bubble';
  const s = 30 + Math.random() * 90;
  b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}vw;background:${pick(COLORS)};animation-duration:${14 + Math.random() * 18}s;animation-delay:-${Math.random() * 20}s`;
  document.body.appendChild(b);
}

// ---------- home ----------
$('title').innerHTML = 'RAINBOW POP'.split('').map((ch, i) => ch === ' ' ? ' ' : `<span style="color:${COLORS[i % COLORS.length]}">${ch}</span>`).join('');
const modesEl = $('modes');
for (const m of MODES) {
  const b = document.createElement('button'); b.className = 'mode'; b.style.background = m.color;
  b.innerHTML = `<span class="big">${m.icon}</span><span>${m.name}</span>`;
  b.addEventListener('click', () => { ctx(); sfx.tap(); start(m.id); });
  modesEl.appendChild(b);
}
function showTotal() { $('total').textContent = total ? `⭐ ${total} stars so far!` : ''; }
showTotal();
$('btn-mute').textContent = muted ? '🔇' : '🔊';
$('btn-mute').addEventListener('click', () => { muted = !muted; $('btn-mute').textContent = muted ? '🔇' : '🔊'; try { localStorage.setItem('rainbow-pop-muted', muted ? '1' : '0'); } catch {} if (muted && 'speechSynthesis' in window) speechSynthesis.cancel(); });
$('btn-home').addEventListener('click', goHome);
$('btn-say').addEventListener('click', () => { if (current) speak(current.say); });

// ---------- play ----------
let mode = null; let round = 0; let current = null; let wrongs = 0; let busy = false;
function goHome() {
  mode = null; $('play').classList.remove('on'); $('home').hidden = false; $('btn-home').hidden = true; $('mic').hidden = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  showTotal();
}
function start(id) {
  mode = id; round = 0;
  $('home').hidden = true; $('play').classList.add('on'); $('btn-home').hidden = false;
  drawStars();
  nextRound();
}
function drawStars() {
  $('stars').innerHTML = Array.from({ length: ROUNDS }, (_, i) => `<span class="${i < round ? 'lit' : ''}">⭐</span>`).join('');
}

function makeRound() {
  switch (mode) {
    case 'letters': {
      const letters = shuffle(Object.keys(LETTERS)).slice(0, 3); const target = pick(letters);
      return { prompt: `Find the letter ${target}`, say: `Find the letter ${target}.`, card: { text: LETTERS[target][1] + '', small: true }, choices: letters.map((l) => ({ label: l, ok: l === target })), win: `${target}! ${target} is for ${LETTERS[target][0]}.` };
    }
    case 'say': {
      const l = pick(Object.keys(LETTERS));
      return { prompt: 'What letter is this?', say: 'What letter is this? Say it out loud!', card: { text: l, tap: true }, choices: [], reveal: { text: l, sub: `${l} is for ${LETTERS[l][0]} ${LETTERS[l][1]}` }, win: `${l}! ${l} is for ${LETTERS[l][0]}.`, answer: l, alt: LETTERS[l][0] };
    }
    case 'words': {
      const ws = shuffle(WORDS).slice(0, 3); const t = pick(ws);
      return { prompt: `Which word says ${t[0]}?`, say: `Which word says ${t[0]}?`, card: { text: t[1] }, choices: ws.map((w) => ({ label: w[0].toUpperCase(), ok: w === t, word: true })), win: `${t[0].toUpperCase().split('').join(', ')}, ${t[0]}!` };
    }
    case 'pictures': {
      const ps = shuffle(PICTURES).slice(0, 3); const t = pick(ps);
      return { prompt: `Find the ${t[0]}`, say: `Find the ${t[0]}.`, card: { text: t[0].toUpperCase(), small: true }, choices: ps.map((p) => ({ label: p[1], ok: p === t })), win: `That's the ${t[0]}!` };
    }
    case 'numbers': {
      if (Math.random() < 0.5) {
        const n = 1 + Math.floor(Math.random() * 5); const thing = pick(COUNT_THINGS);
        const opts = shuffle([n, ...shuffle([1, 2, 3, 4, 5].filter((x) => x !== n)).slice(0, 2)]);
        return { prompt: 'How many?', say: 'How many can you count?', card: { text: thing.repeat(n), small: true }, choices: opts.map((o) => ({ label: String(o), ok: o === n })), win: `${n}! There are ${n}.` };
      }
      const a = 1 + Math.floor(Math.random() * 3); const b = 1 + Math.floor(Math.random() * Math.min(3, 5 - a)); const sum = a + b; const thing = pick(COUNT_THINGS);
      const opts = shuffle([sum, ...shuffle([1, 2, 3, 4, 5].filter((x) => x !== sum)).slice(0, 2)]);
      return { prompt: `${a} + ${b} = ?`, say: `What is ${a} plus ${b}?`, card: { sum: [thing.repeat(a), thing.repeat(b)] }, choices: opts.map((o) => ({ label: String(o), ok: o === sum })), win: `${a} plus ${b} is ${sum}!` };
    }
  }
}

function nextRound() {
  current = makeRound(); wrongs = 0; busy = false;
  $('prompt-text').textContent = current.prompt;
  const card = $('card');
  card.className = ''; card.onclick = null;
  if (current.card.sum) card.innerHTML = `<div class="sum"><span class="grp">${current.card.sum[0]}</span><span class="op">+</span><span class="grp">${current.card.sum[1]}</span><span class="op">=</span><span class="op">?</span></div>`;
  else card.textContent = current.card.text;
  if (current.card.small) card.classList.add('small');
  const ch = $('choices'); ch.innerHTML = '';
  const cols = shuffle(COLORS);
  current.choices.forEach((c, i) => {
    const b = document.createElement('button'); b.className = 'choice' + (c.word ? ' word' : ''); b.style.background = cols[i]; b.textContent = c.label;
    b.addEventListener('click', () => choose(b, c));
    ch.appendChild(b);
  });
  if (mode === 'say') {
    card.classList.add('tap');
    card.onclick = () => reveal();
    $('mic').hidden = !SR; $('mic').classList.remove('listening'); $('mic').textContent = '🎤 Say it and I\'ll listen';
  } else $('mic').hidden = true;
  speak(current.say);
}

async function choose(btn, c) {
  if (busy) return;
  ctx();
  if (c.ok) { busy = true; btn.classList.add('right'); await win(); return; }
  wrongs++; sfx.no(); btn.classList.add('wrong'); setTimeout(() => btn.classList.remove('wrong'), 600);
  speak(pick(['Not that one. Try again!', 'Nearly! Have another go.', 'Hmm, try another one.']));
  if (wrongs >= 2) { const right = [...$('choices').children].find((b, i) => current.choices[i].ok); if (right) right.classList.add('hint'); }
}

async function reveal() {
  if (busy) return; busy = true;
  const card = $('card'); card.classList.remove('tap'); card.onclick = null;
  card.innerHTML = `${current.reveal.text}<span class="sub">${current.reveal.sub}</span>`;
  await win();
}

async function win() {
  round++; total++; try { localStorage.setItem('rainbow-pop-total', String(total)); } catch {}
  drawStars();
  const last = round >= ROUNDS;
  last ? sfx.big() : sfx.win();
  speak(current.win + (last ? ' You did it! Five stars!' : ''));
  await celebrate(last);
  if (last) { await wait(400); goHome(); return; }
  nextRound();
}

// ---------- optional: listen for the letter ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
$('mic').addEventListener('click', () => {
  if (!SR || busy || mode !== 'say') return;
  const rec = new SR(); rec.lang = 'en-GB'; rec.interimResults = false; rec.maxAlternatives = 5;
  $('mic').classList.add('listening'); $('mic').textContent = '🎤 Listening…';
  rec.onresult = (e) => {
    const heard = [...e.results[0]].map((r) => r.transcript.trim().toLowerCase());
    const want = current.answer.toLowerCase(); const alt = current.alt.toLowerCase();
    const ok = heard.some((h) => h === want || h.startsWith(want + ' ') || h.includes(alt) || h.replace(/[^a-z]/g, '').startsWith(want));
    $('mic').classList.remove('listening');
    if (ok) reveal(); else { $('mic').textContent = '🎤 Try again'; speak(`I heard ${heard[0]}. Try again, or tap the letter.`); }
  };
  rec.onerror = () => { $('mic').classList.remove('listening'); $('mic').textContent = '🎤 Tap to try again'; };
  rec.onend = () => { $('mic').classList.remove('listening'); };
  try { rec.start(); } catch { $('mic').hidden = true; }
});
</script>
