<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shelf Pals</title>
<meta name="description" content="Stack 40 toy friends on a shelf, in a spooky house, a lava castle or a pirate ship, then make them all dance. For ages 3 and up.">
<meta name="theme-color" content="#ffc63a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shelf Pals">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
/* Layout: one-screen toy app. Top: scene tabs. Middle: the 2.5D stage. Bottom: 8 action buttons + character tray. */
:root{
  --cream:#fff4dc; --wood:#b9743a; --wood-dk:#7a4520; --sun:#ffc63a; --sun-dk:#e0960a;
  --berry:#ff5d8f; --sky:#8fd3ff; --grass:#6fcf6a; --grape:#8a5cf6; --ink:#3a2a1e; --ink-soft:#6b5342;
  --panel:#fff9ec; --panel-edge:#f2d9a6; --shadow:0 6px 0 rgba(90,50,20,.18), 0 10px 24px rgba(90,50,20,.18);
  --font:"Nunito","Varela Round","SF Pro Rounded",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--cream);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;background:var(--cream)}

/* ---- top bar ---- */
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));
  background:linear-gradient(#fff9ec,#f8e7c0);border-bottom:3px solid var(--panel-edge);position:relative;z-index:5}
#scenes{display:flex;gap:6px;flex:1 1 auto;min-width:0}
.tab{flex:1 1 0;min-width:0;height:54px;border:0;border-radius:16px;background:#fff;box-shadow:0 3px 0 #e3c88f;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2px 4px;cursor:pointer;transition:transform .12s}
.tab .ic{font-size:24px;line-height:1.1}
.tab .lb{font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab.on{background:linear-gradient(#ffe39a,#ffc63a);box-shadow:0 3px 0 var(--sun-dk);transform:translateY(1px)}
.tab:active{transform:scale(.95)}
.ib{flex:0 0 auto;width:48px;height:54px;border:0;border-radius:16px;background:#fff;box-shadow:0 3px 0 #e3c88f;font-size:22px;cursor:pointer;display:grid;place-items:center;position:relative}
.ib:active{transform:scale(.93)}
.ib.off{opacity:.55}
#bin.hold::after{content:"";position:absolute;inset:-4px;border-radius:20px;border:3px solid var(--berry);animation:holdring 1.1s linear forwards}
@keyframes holdring{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* ---- stage ---- */
#stagewrap{flex:1 1 auto;position:relative;overflow:hidden;background:var(--sky);min-height:0;touch-action:none}
#stage{position:absolute;left:0;top:0;width:1000px;transform-origin:0 0;will-change:transform}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#layer,#fx{position:absolute;inset:0}
#fx{pointer-events:none;z-index:5000;overflow:visible}

/* characters */
.pal{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform;touch-action:none;cursor:grab}
.pal .anim{width:100%;height:100%;transform-origin:50% 100%}
.pal svg{width:100%;height:100%;overflow:visible;display:block}
.pal .shade{transform-origin:50% 100%}
.pal.lift{z-index:9000!important;cursor:grabbing}
.pal.lift .anim{transform:scale(1.12) translateY(-10px);filter:drop-shadow(0 18px 10px rgba(0,0,0,.28))}
.pal .anim{transition:filter .2s}
.pal.dim .anim{filter:brightness(.86)}
.pal .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite;animation-delay:var(--bd,0s)}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.pal .arm,.pal .headg,.pal .mouth,.pal .body-g,.pal .wings{transform-box:fill-box}
.pal .arm.l{transform-origin:90% 15%}.pal .arm.r{transform-origin:10% 15%}
.pal .headg{transform-origin:50% 95%}
.pal .mouth{transform-origin:50% 50%}
.pal .wings{transform-origin:50% 50%}
.pal .idle{animation:breathe 2.6s ease-in-out infinite;animation-delay:var(--bd,0s);transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
.pal .wings{animation:flap 1.1s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}

/* placed pop */
.pal.pop .anim{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2,.2)}60%{transform:scale(1.15,.9)}100%{transform:scale(1,1)}}
/* land squash */
.pal.land .anim{animation:land .4s ease-out}
@keyframes land{0%{transform:scale(1.25,.7)}50%{transform:scale(.9,1.12)}100%{transform:scale(1,1)}}
/* solo hop */
.pal.hop .anim{animation:hop .6s ease-in-out}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(4px) scale(1.1,.9)}50%{transform:translateY(-34px) scale(.95,1.08)}80%{transform:translateY(0) scale(1.05,.95)}}

/* ---- actions ---- */
.pal.act-dance .anim{animation:dance .5s ease-in-out infinite alternate;animation-delay:var(--ad,0s)}
@keyframes dance{0%{transform:translateY(0) rotate(-6deg) scale(1.02,.98)}100%{transform:translateY(-16px) rotate(6deg) scale(.98,1.04)}}
.pal.act-dance .arm.l{animation:armL .5s ease-in-out infinite alternate;animation-delay:var(--ad,0s)}
.pal.act-dance .arm.r{animation:armR .5s ease-in-out infinite alternate;animation-delay:var(--ad,0s)}
@keyframes armL{0%{transform:rotate(-30deg)}100%{transform:rotate(-130deg)}}
@keyframes armR{0%{transform:rotate(130deg)}100%{transform:rotate(30deg)}}
.pal.act-dance .headg{animation:headbob .5s ease-in-out infinite alternate;animation-delay:var(--ad,0s)}
@keyframes headbob{0%{transform:rotate(-8deg)}100%{transform:rotate(8deg)}}

.pal.act-spin .anim{animation:spin 1.1s cubic-bezier(.4,0,.3,1) infinite;animation-delay:var(--ad,0s)}
@keyframes spin{0%{transform:rotate(0) translateY(0)}30%{transform:rotate(120deg) translateY(-30px)}70%{transform:rotate(260deg) translateY(-30px)}100%{transform:rotate(360deg) translateY(0)}}

.pal.act-wave .arm.r{animation:wave .5s ease-in-out infinite alternate}
@keyframes wave{0%{transform:rotate(150deg)}100%{transform:rotate(200deg)}}
.pal.act-wave .headg{animation:headbob 1s ease-in-out infinite alternate}

.pal.act-sleep .anim{transform:rotate(14deg) translateX(6px);transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.pal.act-sleep .eyes{animation:none;transform:scaleY(.06)}
.pal.act-sleep .mouth{transform:scale(.6)}
.pal.act-sleep .anim{animation:snore 2.4s ease-in-out infinite;animation-delay:var(--ad,0s)}
@keyframes snore{0%,100%{transform:rotate(14deg) translateX(6px) scale(1,1)}50%{transform:rotate(14deg) translateX(6px) scale(1.03,1.04)}}

.pal.act-sing .anim{animation:sing .42s ease-in-out infinite alternate;animation-delay:var(--ad,0s)}
@keyframes sing{0%{transform:translateY(0) scale(1,1)}100%{transform:translateY(-10px) scale(.97,1.05)}}
.pal.act-sing .mouth{transform:scale(1.8,2.6)}
.pal.act-sing .arm.l{transform:rotate(-120deg)}.pal.act-sing .arm.r{transform:rotate(120deg)}

.pal.act-peek .arm.l{animation:peekL 2.2s ease-in-out infinite;animation-delay:var(--ad,0s)}
.pal.act-peek .arm.r{animation:peekR 2.2s ease-in-out infinite;animation-delay:var(--ad,0s)}
@keyframes peekL{0%,10%{transform:rotate(0)}25%,65%{transform:translate(-3px,-19px) rotate(-162deg)}80%,100%{transform:rotate(0)}}
@keyframes peekR{0%,10%{transform:rotate(0)}25%,65%{transform:translate(3px,-19px) rotate(162deg)}80%,100%{transform:rotate(0)}}
.pal.act-peek .anim{animation:peekhop 2.2s ease-in-out infinite;animation-delay:var(--ad,0s)}
@keyframes peekhop{0%,70%,100%{transform:translateY(0) scale(1,1)}78%{transform:translateY(-22px) scale(1.06,1.08)}88%{transform:translateY(0) scale(1.05,.95)}}

.pal.act-march .anim{animation:march .36s ease-in-out infinite alternate}
@keyframes march{0%{transform:translateY(0) rotate(-4deg)}100%{transform:translateY(-8px) rotate(4deg)}}
.pal.flying .anim{animation:flyspin .9s linear infinite}
@keyframes flyspin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

/* fx */
.fx{position:absolute;left:0;top:0;pointer-events:none;will-change:transform,opacity;font-weight:900}
.fx.spark{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px #ffe27a;animation:spark .7s ease-out forwards}
@keyframes spark{0%{transform:translate(var(--x),var(--y)) scale(.3);opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(1.1);opacity:0}}
.fx.note{font-size:40px;color:var(--grape);text-shadow:0 2px 0 #fff;animation:note 1.4s ease-out forwards}
@keyframes note{0%{transform:translate(var(--x),var(--y)) scale(.4) rotate(-10deg);opacity:0}20%{opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) - 120px)) scale(1.1) rotate(14deg);opacity:0}}
.fx.zz{font-size:34px;color:#5b6dd6;text-shadow:0 2px 0 #fff;animation:zz 1.8s ease-out forwards}
@keyframes zz{0%{transform:translate(var(--x),var(--y)) scale(.5);opacity:0}25%{opacity:1}100%{transform:translate(calc(var(--x) + 40px),calc(var(--y) - 90px)) scale(1.3);opacity:0}}
.fx.puff{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);animation:puff .55s ease-out forwards}
@keyframes puff{0%{transform:translate(var(--x),var(--y)) scale(.3);opacity:.9}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(1.6);opacity:0}}
.fx.heart{font-size:32px;color:var(--berry);animation:note 1.2s ease-out forwards}
.fx.word{font-size:46px;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 rgba(0,0,0,.2);animation:word 1.1s ease-out forwards;white-space:nowrap}
@keyframes word{0%{transform:translate(var(--x),var(--y)) scale(.3) rotate(-8deg);opacity:0}30%{transform:translate(var(--x),calc(var(--y) - 30px)) scale(1.15) rotate(4deg);opacity:1}100%{transform:translate(var(--x),calc(var(--y) - 90px)) scale(1);opacity:0}}

/* drop hint */
#drophint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s}
#drophint.on{opacity:1}
#drophint .zone{position:absolute;border-radius:14px;background:rgba(255,255,255,.22);border:4px dashed rgba(255,255,255,.75);box-shadow:inset 0 0 30px rgba(255,255,255,.3)}
#drophint .zone.near{background:rgba(255,230,120,.45);border-color:#fff}

/* ---- action bar ---- */
#actions{flex:0 0 auto;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:8px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));
  background:linear-gradient(#fff9ec,#fbefd4);border-top:3px solid var(--panel-edge);position:relative;z-index:5}
@media (max-width:620px){#actions{grid-template-columns:repeat(4,1fr)}}
.act{border:0;border-radius:18px;min-height:62px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;
  background:linear-gradient(var(--c1),var(--c2));box-shadow:0 4px 0 var(--c3),0 8px 14px rgba(90,50,20,.18);color:#fff;transition:transform .1s,box-shadow .1s;position:relative}
.act .ic{font-size:30px;line-height:1.05;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.act .lb{font-size:11px;font-weight:900;letter-spacing:.3px;text-shadow:0 1px 0 rgba(0,0,0,.25);text-transform:uppercase}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c3),0 4px 8px rgba(90,50,20,.15)}
.act.on{outline:4px solid #fff;outline-offset:-4px;animation:actpulse .8s ease-in-out infinite alternate}
@keyframes actpulse{from{filter:brightness(1)}to{filter:brightness(1.18)}}
.act[data-a=dance]{--c1:#ff8fb6;--c2:#ff4f86;--c3:#c62a5e}
.act[data-a=jump]{--c1:#7ee2a2;--c2:#2fbf6a;--c3:#1b8a4a}
.act[data-a=spin]{--c1:#8ed8ff;--c2:#3aa5f7;--c3:#1c6fb8}
.act[data-a=wave]{--c1:#ffd37a;--c2:#ffab1f;--c3:#c77c05}
.act[data-a=sing]{--c1:#c9a2ff;--c2:#8f5cf6;--c3:#5f36b8}
.act[data-a=sleep]{--c1:#9aa6ff;--c2:#5d6ddb;--c3:#3a46a3}
.act[data-a=peek]{--c1:#ffb08a;--c2:#ff7a3d;--c3:#c24f16}
.act[data-a=home]{--c1:#8ad7cf;--c2:#2bb0a4;--c3:#17807a}

/* ---- tray ---- */
#tray{flex:0 0 auto;position:relative;background:linear-gradient(#f3dfb3,#e9c98a);border-top:3px solid #d9b26f;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
#tray.over{background:linear-gradient(#ffd6e3,#ff9fbd)}
#tray.over::before{content:"🧺 put away";position:absolute;left:50%;top:-18px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:4px 14px;font-weight:900;font-size:14px;box-shadow:0 3px 0 #e3c88f}
#trayscroll{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:4px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
#trayscroll::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:78px;height:92px;border-radius:18px;background:linear-gradient(#ffffff,#fff3d6);box-shadow:0 3px 0 #d7b170,inset 0 -6px 0 rgba(0,0,0,.04);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 2px 5px;position:relative;touch-action:pan-x;cursor:grab;transition:transform .15s,opacity .2s}
.tile svg{width:60px;height:72px;overflow:visible;pointer-events:none;margin-bottom:-2px}
.tile .nm{font-size:10px;font-weight:900;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;letter-spacing:.2px}
.tile.used{opacity:.42;filter:saturate(.3)}
.tile.used::after{content:"✓";position:absolute;right:5px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--grass);color:#fff;font-size:13px;display:grid;place-items:center;font-weight:900}
.tile.floor{box-shadow:0 3px 0 #d7b170,inset 0 0 0 3px var(--sun)}
.tile.floor::after{content:"▲";position:absolute;right:5px;top:4px;width:22px;height:22px;border-radius:50%;background:var(--sun);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:900;animation:badge .9s ease-in-out infinite alternate}
@keyframes badge{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.tile.wig{animation:wig .4s ease-in-out}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}

/* ghost while dragging from tray */
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:10000;transform-origin:50% 100%;display:none;filter:drop-shadow(0 16px 10px rgba(0,0,0,.3))}
#ghost.on{display:block}
#ghost svg{width:100%;height:100%;overflow:visible}

/* first-run hint */
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:999px;padding:10px 18px;font-weight:900;font-size:15px;color:var(--ink);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;white-space:nowrap;z-index:6000;pointer-events:none;transition:opacity .4s}
#hint .hand{display:inline-block;font-size:24px;animation:handup 1.1s ease-in-out infinite}
@keyframes handup{0%,100%{transform:translateY(6px)}50%{transform:translateY(-10px)}}
#hint.gone{opacity:0}

/* toast */
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%) translateY(-40px);background:#fff;border-radius:16px;padding:10px 16px;font-weight:800;font-size:14px;box-shadow:var(--shadow);z-index:7000;opacity:0;transition:all .3s;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ambient scene animations */
.drift{animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}
.drift2{animation:drift 60s linear infinite;animation-delay:-25s}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flicker{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .18s ease-in-out infinite alternate}
@keyframes flicker{from{transform:scale(1,1);opacity:.9}to{transform:scale(1.15,.9) translateX(1px);opacity:1}}
.glow{animation:glow 1.6s ease-in-out infinite alternate}
.glowsoft{animation:glowsoft 1.3s ease-in-out infinite alternate}
@keyframes glowsoft{from{opacity:.1}to{opacity:.24}}
@keyframes glow{from{opacity:.45}to{opacity:.9}}
.bat{animation:bat 11s linear infinite}
.bat2{animation:bat 15s linear infinite;animation-delay:-6s}
@keyframes bat{0%{transform:translate(-120px,80px)}50%{transform:translate(500px,-20px)}100%{transform:translate(1150px,60px)}}
.bat .w{transform-box:fill-box;transform-origin:50% 50%;animation:flapw .25s ease-in-out infinite alternate}
@keyframes flapw{from{transform:scaleY(1)}to{transform:scaleY(.3)}}
.float{animation:floaty 4s ease-in-out infinite alternate}
@keyframes floaty{from{transform:translateY(-10px)}to{transform:translateY(10px)}}
.bubble{animation:bubble 3s ease-in infinite}
@keyframes bubble{0%{transform:translateY(0) scale(.3);opacity:0}20%{opacity:1}100%{transform:translateY(-70px) scale(1.2);opacity:0}}
.wave1{animation:wavex 6s ease-in-out infinite alternate}
.wave2{animation:wavex 7s ease-in-out infinite alternate-reverse}
@keyframes wavex{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.bob{animation:bob 4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-.6deg)}to{transform:translateY(8px) rotate(.6deg)}}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:flagw 1.4s ease-in-out infinite alternate}
@keyframes flagw{from{transform:skewY(4deg)}to{transform:skewY(-4deg)}}
.twinkle{animation:twinkle 2.2s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.3}to{opacity:1}}
.spinslow{transform-box:fill-box;transform-origin:50% 50%;animation:spinslow 40s linear infinite}
@keyframes spinslow{to{transform:rotate(360deg)}}
.gull{animation:gull 25s linear infinite}
@keyframes gull{from{transform:translate(1100px,0)}to{transform:translate(-200px,-40px)}}

@media (prefers-reduced-motion:reduce){
  .drift,.drift2,.sway,.flicker,.glow,.bat,.bat2,.float,.bubble,.wave1,.wave2,.bob,.flag,.twinkle,.spinslow,.gull,.pal .idle,.pal .wings{animation:none}
}

/* ---- landscape / wide: stage left, controls stacked on the right ---- */
body.land #app{display:grid;grid-template-columns:1fr clamp(250px,32vw,380px);grid-template-rows:auto auto 1fr;grid-template-areas:"top top" "stage actions" "stage tray"}
body.land #topbar{grid-area:top}
body.land #stagewrap{grid-area:stage}
body.land #actions{grid-area:actions;grid-template-columns:repeat(4,1fr);border-top:0;border-left:3px solid var(--panel-edge);padding:8px 8px 6px 8px}
body.land #tray{grid-area:tray;min-height:0;border-top:0;border-left:3px solid #d9b26f;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
body.land #trayscroll{height:100%;overflow-x:hidden;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));justify-items:center;align-content:start;gap:8px;padding:4px 8px 8px;touch-action:pan-y}
body.land .tile{touch-action:pan-y}
body.land #tray.over::before{top:50%;left:-16px;transform:translate(-100%,-50%)}
body.land .act{min-height:58px}

</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <nav id="scenes" aria-label="Choose a place"></nav>
    <button class="ib" id="soundbtn" aria-label="Sound on or off">🔊</button>
    <button class="ib" id="bin" aria-label="Hold to put everyone away">🧺</button>
  </header>
  <main id="stagewrap">
    <div id="stage">
      <svg id="bg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1300" preserveAspectRatio="none"></svg>
      <div id="drophint"></div>
      <div id="layer"></div>
      <div id="fx"></div>
    </div>
    <div id="hint"><span class="hand">👆</span><span>Drag a friend onto the shelf!</span></div>
    <div id="toast"></div>
  </main>
  <section id="actions" aria-label="Everybody do this">

const shade=(hex,amt)=>{ // darken (amt<0) / lighten (amt>0) a #rrggbb
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255;
  const f=c=>Math.max(0,Math.min(255,Math.round(amt<0?c*(1+amt):c+(255-c)*amt)));
  return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
};
const INK='#2b2b3a', PINK='#ff8fb6';

function drawPal(p, uid){

  else if(o==='ghost'){ parts.push(`<path d="M22 60 Q 22 22 50 22 Q 78 22 78 60 L78 112 Q 71 104 64 114 Q 57 124 50 114 Q 43 104 36 114 Q 29 124 22 112 Z" fill="${bodyFill}" stroke="${b2}" stroke-width="2"/><path d="M22 60 Q 22 22 50 22 Q 78 22 78 60 L78 112 Q 71 104 64 114 Q 57 124 50 114 Q 43 104 36 114 Q 29 124 22 112 Z" fill="url(#${g}gl)"/>`);}

  else if(o==='fish'){ /* fish body is the head; nothing here */ }
  else if(o==='smoke'){ parts.push(`<path d="M30 70 Q 50 64 70 70 L 72 100 Q 50 108 28 100 Z" fill="${s}"/><path d="M26 100 C 16 116, 44 112, 50 126 C 56 112, 84 116, 74 100 Q 50 108 26 100 Z" fill="#dbe9ff" opacity=".95"/><path d="M34 104 C 30 112, 44 112, 48 120" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M28 74 L 36 94 L 50 96 L 64 94 L 72 74" fill="none" stroke="${b2}" stroke-width="4" stroke-linejoin="round"/>`);}
  else if(o==='penguin'){ parts.push(`<path d="M30 72 C 30 64, 70 64, 70 72 L 76 112 C 76 122, 24 122, 24 112 Z" fill="${bodyFill}"/><ellipse cx="50" cy="98" rx="16" ry="20" fill="${b2}"/>`);}

const cloud=(x,y,s,cls='',op=.95)=>`<g class="${cls}" transform="translate(${x} ${y}) scale(${s})" opacity="${op}"><ellipse cx="0" cy="0" rx="46" ry="22" fill="#fff"/><circle cx="-24" cy="-6" r="20" fill="#fff"/><circle cx="6" cy="-16" r="26" fill="#fff"/><circle cx="30" cy="-4" r="18" fill="#fff"/></g>`;
// board: top face (lighter) + front edge (darker)
const board=(x0,x1,y,bd,bt,ct,cf,rx=6)=>`<rect x="${x0}" y="${y}" width="${x1-x0}" height="${bd}" fill="${ct}"/><rect x="${x0}" y="${y+bd}" width="${x1-x0}" height="${bt}" rx="${rx}" fill="${cf}"/>`;

/* ===================== SOUND (synthesised, no files) ===================== */
const Sfx=(()=>{
  let ctx=null, master=null, muted=false, loop=null;
  const ensure=()=>{ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=.5; master.connect(ctx.destination);}catch(e){ctx=null;} } if(ctx&&ctx.state==='suspended') ctx.resume().catch(()=>{}); return !!ctx && !muted; };
  const tone=(f0,f1,dur,type='sine',g=.35,delay=0,attack=.01)=>{ if(!ensure())return; const t=ctx.currentTime+delay; const o=ctx.createOscillator(), a=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur); a.gain.setValueAtTime(0,t); a.gain.linearRampToValueAtTime(g,t+attack); a.gain.exponentialRampToValueAtTime(.0008,t+dur); o.connect(a).connect(master); o.start(t); o.stop(t+dur+.05); };
  const noise=(dur,fc0,fc1,g=.3,delay=0)=>{ if(!ensure())return; const t=ctx.currentTime+delay; const n=ctx.sampleRate*dur, buf=ctx.createBuffer(1,n,ctx.sampleRate), d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=buf; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=.8; f.frequency.setValueAtTime(fc0,t); f.frequency.exponentialRampToValueAtTime(fc1,t+dur); const a=ctx.createGain(); a.gain.setValueAtTime(g,t); a.gain.exponentialRampToValueAtTime(.001,t+dur); s.connect(f).connect(a).connect(master); s.start(t); };
  const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
  const api={
    unlock(){ ensure(); },
    get muted(){return muted;},
    setMuted(m){ muted=m; if(m) api.stopLoop(); else ensure(); },
    pop(){ tone(420,880,.14,'sine',.3); tone(880,1320,.1,'triangle',.12,.05); },
    lift(){ tone(300,520,.09,'triangle',.18); },
    poof(){ noise(.35,1800,200,.35); tone(500,120,.3,'sine',.2); },
    boing(d=0){ tone(700,160,.28,'triangle',.3,d); tone(1400,320,.2,'sine',.08,d); },
    land(d=0){ tone(180,60,.16,'sine',.35,d); noise(.12,900,200,.15,d); },
    hop(){ tone(500,900,.12,'triangle',.25); },
    hi(){ tone(660,660,.09,'square',.12); tone(880,990,.14,'square',.12,.1); },
    boo(){ tone(220,660,.25,'sawtooth',.14); tone(440,880,.2,'triangle',.15,.05); },
    giggle(){ [0,.07,.14,.22].forEach((d,i)=>tone(700+i*120,900+i*120,.07,'triangle',.2,d)); },
    zz(){ tone(520,380,.5,'sine',.12); tone(400,300,.6,'sine',.1,.5); },
    whoosh(){ noise(.5,300,3000,.3); },
    spin(){ noise(.45,400,2600,.25); tone(300,1200,.4,'sine',.1); },
    tick(d=0){ tone(900,900,.04,'square',.12,d); },
    sing(i){ const f=PENTA[i%PENTA.length]; tone(f,f*1.01,.28,'triangle',.22); tone(f*2,f*2,.16,'sine',.06); },
    note(i){ tone(PENTA[i%PENTA.length],PENTA[i%PENTA.length],.18,'triangle',.18); },
    chord(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,f,.5,'triangle',.14,i*.03)); },
    startLoop(kind){ api.stopLoop(); if(!ensure())return; const bpm=kind==='march'?120:150, step=60/bpm/2; const mel=[0,2,4,2,0,2,5,4, 0,2,4,5,7,5,4,2]; const bass=[0,0,4,4,2,2,5,5]; let i=0; const play=()=>{ if(!ctx)return; const t=ctx.currentTime; const n=mel[i%mel.length]; tone(PENTA[n],PENTA[n],step*1.2,'triangle',.16,.02); if(i%2===0){ const bn=bass[(i/2)%bass.length]; tone(PENTA[bn]/4,PENTA[bn]/4,step*1.6,'sine',.22,.02);} if(kind==='march' && i%2===0) noise(.06,2000,800,.12,.02); if(i%4===0) noise(.08,6000,3000,.06,.02); i++; }; play(); loop=setInterval(play,step*1000); },
    stopLoop(){ if(loop){ clearInterval(loop); loop=null; } },
  };
  return api;
})();

(function(){

function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ state.placements[scene.id]=[...pals.values()].filter(p=>p.state!=='fly').map(p=>({id:p.id,shelf:p.shelf,depth:+p.depth.toFixed(3),xf:+p.xf.toFixed(3)})); state.scene=scene.id; try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} },120); }

/* ---------- layout ---------- */
function fit(){
  land = window.innerWidth>window.innerHeight*1.15 && window.innerWidth>=640;
  document.body.classList.toggle('land',land);
  const r=wrap.getBoundingClientRect(); const aw=Math.max(200,r.width), ah=Math.max(200,r.height);

  stage.style.transform=`translate(${((aw-W*scale)/2).toFixed(2)}px,${((ah-H*scale)/2).toFixed(2)}px) scale(${scale.toFixed(5)})`;

}
function buildScene(){
  geo=scene.build(H);

  const pad=geo.palH*.12;

/* ---------- pals ---------- */
function fromPlacement(p){
  const sh=geo.shelves[Math.min(p.shelf,geo.shelves.length-1)]; p.shelf=geo.shelves.indexOf(sh);
  p.x=sh.x0+(sh.x1-sh.x0)*p.xf; p.y=sh.top+(sh.bottom-sh.top)*p.depth; p.s=sh.s0+(sh.s1-sh.s0)*p.depth;
  markTile(p.id, sh.floor ? 'floor' : 'shelf');
}
const onFloor=p=>!!geo.shelves[p.shelf]?.floor;
function toPlacement(p,i,x,y){
  const sh=geo.shelves[i]; const m=geo.palH*.28/(sh.x1-sh.x0);
  p.shelf=i; p.depth=clamp((y-sh.top)/Math.max(1,(sh.bottom-sh.top)),0,1); p.xf=clamp((x-sh.x0)/(sh.x1-sh.x0),m,1-m);

  p.el.classList.toggle('dim', p.state==='idle' && p.depth<.3);

function nearestShelf(x,y){
  let best=0,bd=1e9;
  geo.shelves.forEach((sh,i)=>{ const dy=y<sh.top?sh.top-y:(y>sh.bottom?y-sh.bottom:0); const dx=x<sh.x0?sh.x0-x:(x>sh.x1?x-sh.x1:0); const d=Math.hypot(dx*.7,dy); if(d<bd){bd=d;best=i;} });

function addPal(id,pl,opts={}){

  const p={id,spec,el,anim,shelf:pl.shelf??0,depth:pl.depth??.5,xf:pl.xf??.5,x:0,y:0,s:1,state:'idle',vx:0,vy:0,bounces:0};
  fromPlacement(p); render(p); pals.set(id,p);
  if(opts.pop){ el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),500); sparkle(p.x,p.y-geo.palH*.5); Sfx.pop(); }
  if(!opts.quiet){ dismissHint(); save(); } return p;
}
function removePal(id,silent){
  const p=pals.get(id); if(!p) return;
  if(!silent){ puff(p.x,p.y-geo.palH*.4); Sfx.poof(); }
  p.el.remove(); pals.delete(id); markTile(id,false); save();
}
function freeSpot(){ // a random, reasonably empty spot on a non-floor shelf
  const cands=geo.shelves.map((s,i)=>i).filter(i=>!geo.shelves[i].floor);
  let best=null,bestD=-1;
  for(let k=0;k<10;k++){
    const i=cands[Math.floor(Math.random()*cands.length)], sh=geo.shelves[i];
    const xf=rnd(.12,.88), depth=rnd(.3,.85); const x=sh.x0+(sh.x1-sh.x0)*xf;
    let d=1e9; for(const p of pals.values()){ if(p.shelf===i) d=Math.min(d,Math.abs(p.x-x)); }
    if(d>bestD){bestD=d;best={shelf:i,depth,xf};}
  }
  return best;
}

/* ---------- fx ---------- */
function spawn(cls,x,y,txt,dx=0,dy=0,extra=''){ const e=document.createElement('span'); e.className='fx '+cls; e.style.cssText=`--x:${x}px;--y:${y}px;--dx:${dx}px;--dy:${dy}px;${extra}`; if(txt) e.textContent=txt; fxLayer.appendChild(e); e.addEventListener('animationend',()=>e.remove()); setTimeout(()=>e.remove(),2600); }
function sparkle(x,y){ for(let i=0;i<7;i++){ const a=rnd(0,Math.PI*2), d=rnd(50,120); spawn('spark',x-7,y-7,'',Math.cos(a)*d,Math.sin(a)*d); } }
function puff(x,y){ for(let i=0;i<5;i++){ const a=rnd(0,Math.PI*2), d=rnd(20,70); spawn('puff',x-20,y-20,'',Math.cos(a)*d,Math.sin(a)*d-20); } }
const NOTES=['♪','♫','♩','♬'];
function note(p){ spawn('note',p.x+rnd(-30,30),p.y-geo.palH*p.s-10,NOTES[Math.floor(Math.random()*4)],rnd(-40,40),0,`color:${['#8a5cf6','#ff5d8f','#3aa5f7','#2fbf6a'][Math.floor(Math.random()*4)]}`); }
function word(p,t){ spawn('word',p.x-40,p.y-geo.palH*p.s-16,t); }

/* ---------- speech ---------- */
function say(text){ try{ if(Sfx.muted||!('speechSynthesis' in window)) return; const u=new SpeechSynthesisUtterance(text); u.rate=.95; u.pitch=1.35; u.volume=.9; speechSynthesis.speak(u); }catch(e){} }

/* ---------- toast + hint ---------- */
let toastT=null; function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('on'),1800); }
function dismissHint(){ if(!state.hinted){ state.hinted=true; firstHint.classList.add('gone'); setTimeout(()=>firstHint.remove(),500); } }

/* ---------- pointer: stage ---------- */
let drag=null, trayDrag=null;
const toStage=e=>({x:(e.clientX-stageRect.left)/scale,y:(e.clientY-stageRect.top)/scale});
function beginDrag(p,e,offX,offY,fromTray){
  stageRect=stage.getBoundingClientRect();
  clearActionFor(p);
  p.state='drag'; p.el.classList.add('lift'); p.el.classList.remove('flying','dim');
  drag={p,offX,offY,sx:e.clientX,sy:e.clientY,moved:false,fromTray,t0:performance.now(),overTray:false};
  hintEl.classList.add('on'); Sfx.lift();
  moveDrag(e);
}
function moveDrag(e){
  const p=drag.p; const pt=toStage(e);
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8) drag.moved=true;
  p.x=pt.x+drag.offX; p.y=pt.y+drag.offY; p.s=1.0; render(p);
  const tr=tray.getBoundingClientRect(); const over=land ? e.clientX>tr.left-10 : e.clientY>tr.top-10;
  if(over!==drag.overTray){ drag.overTray=over; tray.classList.toggle('over',over); }
  const n=nearestShelf(p.x,p.y); hintEl.querySelectorAll('.zone').forEach(z=>z.classList.toggle('near',+z.dataset.i===n && !over));
}
function endDrag(e,cancel){
  const d=drag; drag=null; const p=d.p; p.el.classList.remove('lift'); hintEl.classList.remove('on'); hintEl.querySelectorAll('.zone').forEach(z=>z.classList.remove('near')); tray.classList.remove('over');
  if(!d.moved && !d.fromTray && !cancel){ p.state='idle'; fromPlacement(p); render(p); solo(p); return; }
  if(d.overTray || cancel){ p.state='idle'; removePal(p.id, cancel && d.fromTray); return; }
  const pt=toStage(e); const fx=pt.x+d.offX, fy=pt.y+d.offY;
  const i=nearestShelf(fx,fy); toPlacement(p,i,fx,fy); p.state='idle'; render(p);
  p.el.classList.add('land'); setTimeout(()=>p.el.classList.remove('land'),450);
  Sfx.pop(); sparkle(p.x,p.y-geo.palH*.4); dismissHint(); save();
}
layer.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.pal'); if(!el||drag||trayDrag) return;
  const p=pals.get(el.dataset.id); if(!p||p.state==='fly'||p.state==='tween') return;
  e.preventDefault(); Sfx.unlock(); stageRect=stage.getBoundingClientRect(); const pt=toStage(e);
  beginDrag(p,e,p.x-pt.x,p.y-pt.y,false);
});
window.addEventListener('pointermove',e=>{
  if(drag){ moveDrag(e); return; }
  if(trayDrag && !trayDrag.started){
    const dx=e.clientX-trayDrag.x0, dy=e.clientY-trayDrag.y0;
    const pull = land ? (dx<-14 && Math.abs(dx)>Math.abs(dy)) : (dy<-14 && Math.abs(dy)>Math.abs(dx));
    const scrolls = land ? Math.abs(dy)>12 : Math.abs(dx)>12;
    if(pull){ trayDrag.started=true; startTrayDrag(e); }
    else if(scrolls) trayDrag=null;        // let the tray scroll
  }
},{passive:true});
const up=e=>{ if(drag) endDrag(e,e.type==='pointercancel'); if(trayDrag){ if(!trayDrag.started && e.type!=='pointercancel' && Math.hypot(e.clientX-trayDrag.x0,e.clientY-trayDrag.y0)<10) tapTile(trayDrag.id); trayDrag=null; } };
window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
window.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- pointer: tray ---------- */
function buildTray(){
  trayScroll.innerHTML=PALS.map(p=>`<div class="tile" data-id="${p.id}">${drawPal(p,'t'+p.id)}<span class="nm">${p.n}</span></div>`).join('');
}
function markTile(id,where){ const t=trayScroll.querySelector(`.tile[data-id="${id}"]`); if(!t) return; t.classList.toggle('used',where==='shelf'); t.classList.toggle('floor',where==='floor'); }
function wiggleTile(id){ const t=trayScroll.querySelector(`.tile[data-id="${id}"]`); if(t){ t.classList.remove('wig'); void t.offsetWidth; t.classList.add('wig'); } }
trayScroll.addEventListener('pointerdown',e=>{ const t=e.target.closest('.tile'); if(!t||drag) return; Sfx.unlock(); trayDrag={id:t.dataset.id,x0:e.clientX,y0:e.clientY,started:false}; });
function startTrayDrag(e){
  const id=trayDrag.id; trayDrag=null;
  if(pals.has(id)){ const p=pals.get(id);
    if(onFloor(p) && p.state==='idle'){ stageRect=stage.getBoundingClientRect(); beginDrag(p,e,land?-geo.palH*.3:0,land?geo.palH*.3:geo.palH*.55,false); return; }   // pick them up off the floor
    wiggleTile(id); solo(p); return; }
  stageRect=stage.getBoundingClientRect();
  const p=addPal(id,{shelf:0,depth:.5,xf:.5},{});
  beginDrag(p,e,land?-geo.palH*.3:0,land?geo.palH*.3:geo.palH*.55,true);
}
function tapTile(id){
  if(pals.has(id)){ const p=pals.get(id);
    if(onFloor(p) && p.state==='idle'){ clearActionFor(p); flyTo(p,freeSpot(),0); Sfx.boing(); say(p.spec.n); markTile(id,'shelf'); return; }   // back up onto a shelf
    wiggleTile(id); solo(p); return; }
  const p=addPal(id,freeSpot(),{pop:true}); if(p) say(p.spec.n);
}

/* ---------- solo tap ---------- */
function solo(p){
  p.el.classList.remove('hop'); void p.el.offsetWidth; p.el.classList.add('hop'); setTimeout(()=>p.el.classList.remove('hop'),650);
  Sfx.giggle(); for(let i=0;i<3;i++) spawn('heart',p.x+rnd(-30,30),p.y-geo.palH*p.s-10,'💗',rnd(-40,40));
  say(p.spec.n);
}

/* ---------- actions ---------- */
let current=null, actT=null, fxT=null, timers=[];
const later=(fn,ms)=>{ const t=setTimeout(fn,ms); timers.push(t); return t; };
const ACT_CLASSES=['act-dance','act-spin','act-wave','act-sleep','act-sing','act-peek','act-march'];
function clearActionFor(p){ p.el.classList.remove(...ACT_CLASSES); p.el.style.removeProperty('--sync'); }
function clearAction(){ for(const p of pals.values()) clearActionFor(p); current=null; clearTimeout(actT); clearInterval(fxT); timers.forEach(clearTimeout); timers=[]; Sfx.stopLoop(); document.querySelectorAll('.act.on').forEach(b=>b.classList.remove('on')); }
function setButton(a,ms){ const b=document.querySelector(`.act[data-a="${a}"]`); if(b){ b.classList.add('on'); if(ms) setTimeout(()=>b.classList.remove('on'),ms); } }
const list=()=>[...pals.values()].filter(p=>p.state==='idle');
function doAction(a){
  Sfx.unlock();
  if(pals.size===0){ toast('Tap a friend below to add them first'); PALS.slice(0,6).forEach(p=>wiggleTile(p.id)); return; }
  if(current===a && a==='sleep'){ clearAction(); Sfx.hi(); return; }   // tap Sleep again to wake up
  clearAction(); current=a;
  const L=list();
  if(a==='dance'){ L.forEach(p=>p.el.classList.add('act-dance')); Sfx.startLoop('dance'); fxT=setInterval(()=>{ const p=L[Math.floor(Math.random()*L.length)]; if(p) note(p); },260); setButton(a,9000); actT=setTimeout(clearAction,9000); }
  else if(a==='spin'){ L.forEach(p=>p.el.classList.add('act-spin')); Sfx.spin(); fxT=setInterval(()=>Sfx.spin(),1100); setButton(a,3300); actT=setTimeout(clearAction,3300); }
  else if(a==='wave'){ L.forEach(p=>p.el.classList.add('act-wave')); Sfx.hi(); L.slice(0,8).forEach((p,i)=>later(()=>word(p,['Hi!','Hello!','Hiya!'][i%3]),i*180)); setButton(a,3200); actT=setTimeout(clearAction,3200); }
  else if(a==='sing'){ L.forEach(p=>p.el.classList.add('act-sing')); let i=0; fxT=setInterval(()=>{ Sfx.sing([0,2,4,5,4,2,0,7][i%8]); const p=L[i%L.length]; if(p) note(p); i++; },300); setButton(a,6000); actT=setTimeout(clearAction,6000); }
  else if(a==='sleep'){ L.forEach(p=>p.el.classList.add('act-sleep')); Sfx.zz(); fxT=setInterval(()=>{ const p=L[Math.floor(Math.random()*L.length)]; if(p) spawn('zz',p.x+20,p.y-geo.palH*p.s,['z','Zz','ZZZ'][Math.floor(Math.random()*3)]); },900); setButton(a,0); actT=setTimeout(()=>{ clearAction(); Sfx.hi(); },30000); }
  else if(a==='peek'){ L.forEach(p=>{ p.el.style.setProperty('--ad','0s'); p.el.classList.add('act-peek'); }); let n=0; const cyc=()=>{ later(()=>{ Sfx.boo(); L.slice(0,10).forEach((p,i)=>later(()=>word(p,'BOO!'),i*40)); },1500); }; cyc(); fxT=setInterval(()=>{ if(++n<3) cyc(); },2200); setButton(a,6600); actT=setTimeout(()=>{ clearAction(); L.forEach(p=>p.el.style.setProperty('--ad',(Math.random()*.45).toFixed(2)+'s')); },6600); }
  else if(a==='jump'){ jumpOff(); setButton(a,1500); }
  else if(a==='home'){ lineUp(); setButton(a,1800); }
}
document.querySelectorAll('.act').forEach(b=>b.addEventListener('click',()=>doAction(b.dataset.a)));

/* ---------- jump off (physics) ---------- */
function jumpOff(){
  const floor=geo.shelves[geo.shelves.length-1];
  const L=list().sort((a,b)=>(a.shelf-b.shelf)||(a.x-b.x));
  const order=L.map((p,i)=>i).sort(()=>Math.random()-.5);   // landing slots across the floor, shuffled
  const m=geo.palH*.35, span=(floor.x1-m)-(floor.x0+m);
  L.forEach((p,i)=>{ setTimeout(()=>{ if(p.state!=='idle') return;
    const onFloor=geo.shelves[p.shelf].floor;
    p.state='fly'; p.bounces=0; p.el.classList.add('flying');
    p.vy = -rnd(560,920);
    p.landY = onFloor ? p.y : floor.top+rnd(0,floor.bottom-floor.top);
    const T=(p.vy*-1+Math.sqrt(p.vy*p.vy+2*G*Math.max(1,p.landY-p.y)))/G;   // time until landing
    const tx = onFloor ? p.x+rnd(-40,40) : floor.x0+m+span*((order[i]+.5)/L.length)+rnd(-30,30);
    p.vx = clamp((tx-p.x)/T,-900,900);
    p.ts = floor.s0+(floor.s1-floor.s0)*((p.landY-floor.top)/(floor.bottom-floor.top));
    Sfx.boing(); startLoop();
  },i*90); });
}
function stepFly(p,dt){
  const floor=geo.shelves[geo.shelves.length-1], m=geo.palH*.3;
  p.vy+=G*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.s+=(p.ts-p.s)*Math.min(1,dt*3);
  if(p.x<floor.x0+m){ p.x=floor.x0+m; p.vx=Math.abs(p.vx)*.6; } if(p.x>floor.x1-m){ p.x=floor.x1-m; p.vx=-Math.abs(p.vx)*.6; }
  if(p.y>=p.landY && p.vy>0){
    p.y=p.landY;
    if(p.vy>420 && p.bounces<2){ p.vy=-p.vy*.38; p.vx*=.6; p.bounces++; Sfx.land(); puff(p.x,p.y-10); }
    else { p.state='idle'; p.el.classList.remove('flying'); toPlacement(p,geo.shelves.length-1,p.x,p.landY); p.el.classList.add('land'); setTimeout(()=>p.el.classList.remove('land'),450); Sfx.land(); puff(p.x,p.y-10); save(); }
  }
  render(p);
}

/* ---------- line up (tween back onto the shelves) ---------- */
function lineUp(){
  const L=list().sort((a,b)=>(a.shelf-b.shelf)||(a.x-b.x)); if(!L.length) return;
  const palW=geo.palH*100/130*.95; const slots=[];
  const shelvesNoFloor=geo.shelves.map((s,i)=>i).filter(i=>!geo.shelves[i].floor);
  const caps=shelvesNoFloor.map(i=>Math.max(1,Math.floor((geo.shelves[i].x1-geo.shelves[i].x0)/palW)));
  let remaining=L.length, idx=0;
  shelvesNoFloor.forEach((si,k)=>{ const n=Math.min(caps[k],Math.ceil(remaining*(caps[k]/caps.slice(k).reduce((a,b)=>a+b,0)))); for(let j=0;j<n&&idx<L.length;j++,idx++){ slots.push({shelf:si,n,j}); } remaining=L.length-idx; });
  while(idx<L.length){ slots.push({shelf:geo.shelves.length-1,n:L.length-slots.length+ (slots.filter(s=>s.shelf===geo.shelves.length-1).length),j:idx}); idx++; }
  // normalise floor overflow positions
  const fl=slots.filter(s=>s.shelf===geo.shelves.length-1); fl.forEach((s,j)=>{ s.n=fl.length; s.j=j; });
  L.forEach((p,i)=>{ const sl=slots[i]; flyTo(p,{shelf:sl.shelf,xf:(sl.j+.5)/sl.n,depth:.5},i*45); });
  Sfx.startLoop('march');
  setTimeout(()=>{ Sfx.stopLoop(); Sfx.chord(); },950+L.length*45+100);
}
function flyTo(p,pl,delay){
  const sh=geo.shelves[pl.shelf]; const tx=sh.x0+(sh.x1-sh.x0)*pl.xf, ty=sh.top+(sh.bottom-sh.top)*pl.depth, ts=sh.s0+(sh.s1-sh.s0)*pl.depth;
  p.state='tween'; p.tw={x0:p.x,y0:p.y,s0:p.s,x1:tx,y1:ty,s1:ts,t0:performance.now()+delay,d:950,shelf:pl.shelf}; p.el.classList.add('act-march'); startLoop();
}
function stepTween(p,now){
  const t=p.tw; let k=clamp((now-t.t0)/t.d,0,1); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  p.x=t.x0+(t.x1-t.x0)*e; p.y=t.y0+(t.y1-t.y0)*e-Math.sin(k*Math.PI)*geo.palH*.9; p.s=t.s0+(t.s1-t.s0)*e;
  if(k>=1){ p.state='idle'; p.el.classList.remove('act-march'); toPlacement(p,t.shelf,t.x1,t.y1); p.el.classList.add('land'); setTimeout(()=>p.el.classList.remove('land'),450); sparkle(p.x,p.y-geo.palH*.4); Sfx.tick(); save(); }
  render(p);
}

/* ---------- animation loop ---------- */
function startLoop(){ if(loopOn) return; loopOn=true; last=performance.now(); requestAnimationFrame(loop); }
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; let active=false;
  for(const p of pals.values()){ if(p.state==='fly'){ active=true; stepFly(p,dt); } else if(p.state==='tween'){ active=true; stepTween(p,now); } }
  if(active) requestAnimationFrame(loop); else loopOn=false; }

/* ---------- scenes ---------- */
function buildTabs(){ tabsEl.innerHTML=SCENES.map((s,i)=>`<button class="tab${s===scene?' on':''}" data-i="${i}" aria-label="${s.name}"><span class="ic">${s.icon}</span><span class="lb">${s.short||s.name}</span></button>`).join(''); }
tabsEl.addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(!b) return; setScene(SCENES[+b.dataset.i]); });
function setScene(s){
  if(s===scene) return;
  clearAction(); save();
  for(const id of [...pals.keys()]) removePal(id,true);
  scene=s; buildTabs(); fit(); restore(); Sfx.whoosh(); save();
}
function restore(){ const pl=state.placements[scene.id]||[]; pl.forEach(it=>{ if(specOf(it.id)) addPal(it.id,it); }); }

/* ---------- top bar ---------- */
const soundBtn=$('#soundbtn'); function paintSound(){ soundBtn.textContent=state.muted?'🔇':'🔊'; soundBtn.classList.toggle('off',state.muted); }
soundBtn.addEventListener('click',()=>{ state.muted=!state.muted; Sfx.setMuted(state.muted); if(!state.muted) Sfx.pop(); paintSound(); save(); });
const bin=$('#bin'); let holdT=null;
const holdStart=e=>{ e.preventDefault(); if(!pals.size){ toast('The shelf is already empty'); return; } bin.classList.add('hold'); holdT=setTimeout(()=>{ bin.classList.remove('hold'); clearAction(); for(const id of [...pals.keys()]) removePal(id); toast('Everyone is back in the basket'); },1100); };
const holdEnd=()=>{ bin.classList.remove('hold'); clearTimeout(holdT); };
bin.addEventListener('pointerdown',holdStart); bin.addEventListener('pointerup',holdEnd); bin.addEventListener('pointercancel',holdEnd); bin.addEventListener('pointerleave',holdEnd);

/* ---------- boot ---------- */
document.addEventListener('visibilitychange',()=>{ if(document.hidden) clearAction(); });
Sfx.setMuted(!!state.muted); paintSound();
scene=SCENES.find(s=>s.id===state.scene)||SCENES[0];
buildTabs(); buildTray(); fit();
if(state.placements[scene.id]) restore();
else { // first visit: a few friends already on the shelf so the game is obvious at a glance
  const demo=[['mimi',0,.55,.3],['bramble',0,.6,.7],['ember',1,.5,.5],['lila',2,.5,.35],['rocket',2,.55,.72]];
  demo.forEach(([id,shelf,depth,xf])=>{ if(geo.shelves[shelf]) addPal(id,{shelf,depth,xf},{quiet:true}); });
}
if(state.hinted) firstHint.remove();
try{ if(navigator.wakeLock) document.addEventListener('pointerdown',()=>navigator.wakeLock.request('screen').catch(()=>{}),{once:true}); }catch(e){}
window.__sp={pals,state,doAction,setScene,get geo(){return geo;},get scene(){return scene;},addPal,removePal};
})();

if('serviceWorker' in navigator && location.protocol==='https:'){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
